<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XBRL Agent — Live run and reasoning prototype</title>
  <!--
    PROTOTYPE — throwaway, not production.
    Three variants of the live-run and AI settings experience, switchable via
    ?variant=a|b|c and ?page=run|settings.

    Question: how can every worker remain visible in one pane, with one clear
    run narrative and a persistent provider-reasoning summary rail, without
    turning the page into a monitoring console?
  -->
  <style>
    :root {
      --orange-700: #d64000;
      --orange-500: #fd5108;
      --orange-100: #ffe8d4;
      --orange-50: #fff5ed;
      --black: #000;
      --white: #fff;
      --grey-950: #111315;
      --grey-800: #34383d;
      --grey-700: #535960;
      --grey-500: #777e86;
      --grey-300: #cbd1d6;
      --grey-200: #dfe3e6;
      --grey-100: #eeeff1;
      --grey-50: #f6f7f8;
      --green: #147d47;
      --red: #b42318;
      --blue: #175cd3;
      --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --shadow: 0 18px 50px rgba(0, 0, 0, .13);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; background: var(--white); color: var(--black); font: 14px/1.45 var(--font); }
    button, select, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible {
      outline: 2px solid var(--black); outline-offset: 2px;
    }
    .hidden { display: none !important; }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .muted { color: var(--grey-700); }
    .micro { color: var(--grey-500); font-size: 11px; }
    .eyebrow { color: var(--orange-700); font-size: 10px; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }

    .shell { display: grid; grid-template-columns: 212px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { padding: 26px 18px; background: var(--grey-50); border-right: 1px solid var(--grey-200); }
    .brand { display: flex; align-items: center; gap: 10px; margin: 0 8px 34px; font-size: 16px; font-weight: 740; }
    .brand-mark { width: 26px; height: 26px; display: grid; place-items: center; color: var(--orange-500); font-size: 21px; }
    .nav-label { margin: 24px 10px 8px; color: var(--grey-500); font-size: 9px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    .nav-button { width: 100%; min-height: 39px; padding: 0 11px; border: 0; border-radius: 7px; background: transparent; display: flex; align-items: center; gap: 10px; color: var(--grey-700); text-align: left; cursor: pointer; }
    .nav-button:hover, .nav-button.active { background: var(--white); color: var(--black); }
    .nav-button.active { font-weight: 680; }
    .nav-icon { width: 18px; text-align: center; }
    .sidebar-foot { position: fixed; bottom: 24px; left: 26px; width: 160px; color: var(--grey-500); font-size: 10px; }

    main { min-width: 0; padding: 34px clamp(26px, 4vw, 62px) 100px; }
    .page { width: min(1420px, 100%); margin: 0 auto; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
    .page-head h1 { margin: 5px 0 5px; font-size: clamp(23px, 2.3vw, 32px); line-height: 1.15; letter-spacing: -.035em; }
    .page-head p { max-width: 700px; margin: 0; color: var(--grey-700); }
    .head-actions { display: flex; align-items: center; gap: 8px; }
    .button { min-height: 38px; padding: 0 13px; border: 1px solid var(--grey-300); border-radius: 7px; background: var(--white); font-weight: 650; cursor: pointer; }
    .button:hover { background: var(--grey-50); border-color: var(--grey-700); }
    .button.primary { background: var(--black); border-color: var(--black); color: var(--white); }
    .button.selected { background: var(--grey-950); border-color: var(--grey-950); color: var(--white); }
    .button.danger { border-color: transparent; color: var(--red); background: transparent; }
    .button.small { min-height: 31px; padding: 0 9px; font-size: 11px; }

    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--grey-300); flex: 0 0 auto; }
    .status-dot.running { width: 14px; height: 14px; background: transparent; border: 2px solid var(--orange-100); border-top-color: var(--orange-500); box-shadow: none; animation: rotate-arc .85s linear infinite; }
    .status-dot.done { background: var(--black); }
    .status-dot.queued { background: var(--grey-300); }
    .status-dot.attention { background: var(--orange-500); }
    @keyframes rotate-arc { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .status-dot.running { animation: none; } }

    .run-strip { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 22px; align-items: center; padding: 17px 0 21px; border-top: 1px solid var(--grey-200); border-bottom: 1px solid var(--grey-200); }
    .run-now { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
    .run-now .status-dot { margin-top: 4px; }
    .run-now strong { display: block; font-size: 16px; }
    .run-now p { margin: 3px 0 0; color: var(--grey-700); }
    .run-totals { display: flex; align-items: center; gap: 26px; }
    .run-total { min-width: 86px; }
    .run-total strong { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
    .run-total span { color: var(--grey-500); font-size: 10px; }

    .phase-line { display: grid; grid-template-columns: repeat(5, 1fr); margin: 22px 0 28px; }
    .phase { position: relative; padding-top: 12px; border-top: 2px solid var(--grey-200); color: var(--grey-500); font-size: 11px; }
    .phase::before { content: ""; position: absolute; top: -5px; left: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--grey-200); }
    .phase.done { border-color: var(--black); color: var(--black); }
    .phase.done::before { background: var(--black); }
    .phase.active { border-color: var(--orange-500); color: var(--black); font-weight: 650; }
    .phase.active::before { background: var(--orange-500); box-shadow: 0 0 0 4px var(--orange-50); }

    .workspace { display: grid; grid-template-columns: minmax(520px, 1.35fr) minmax(330px, .75fr); gap: clamp(26px, 3vw, 46px); align-items: start; }
    .section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 10px; }
    .section-head h2 { margin: 0; font-size: 16px; }
    .filters { display: flex; gap: 3px; }
    .filter { min-height: 29px; padding: 0 9px; border: 0; border-radius: 6px; background: transparent; color: var(--grey-700); font-size: 11px; cursor: pointer; }
    .filter.active, .filter:hover { background: var(--grey-50); color: var(--black); }

    .agent-table { border-top: 1px solid var(--grey-200); }
    .agent-row { width: 100%; min-height: 67px; padding: 9px 10px; border: 0; border-bottom: 1px solid var(--grey-100); background: transparent; display: grid; grid-template-columns: 18px minmax(145px, .65fr) minmax(230px, 1fr) 76px; gap: 10px; align-items: center; text-align: left; cursor: pointer; }
    .agent-row:hover, .agent-row.active { background: var(--grey-50); }
    .agent-row .name strong, .agent-row .task strong { display: block; font-size: 12px; }
    .agent-row .name span, .agent-row .task span { display: block; margin-top: 2px; color: var(--grey-700); font-size: 11px; }
    .agent-row .state-block { justify-self: end; display: grid; justify-items: end; gap: 2px; min-width: 64px; }
    .agent-row .state { color: var(--grey-700); font-size: 11px; white-space: nowrap; }
    .agent-row .state.running { color: var(--orange-700); font-weight: 650; }
    .agent-row .elapsed { color: var(--grey-500); font: 10px var(--mono); font-variant-numeric: tabular-nums; }
    .agent-row .progress-track { grid-column: 2 / -1; width: 100%; height: 2px; margin-top: -7px; background: var(--grey-100); overflow: hidden; }
    .agent-row .progress-track span { display: block; height: 100%; background: var(--orange-500); }
    .agent-row[data-state="hidden"] { display: none; }

    .rail { position: sticky; top: 24px; min-width: 0; padding-left: 28px; border-left: 1px solid var(--grey-200); }
    .rail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .rail-head h2 { margin: 3px 0 0; font-size: 18px; letter-spacing: -.02em; }
    .provider-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 25px; padding: 2px 8px; border-radius: 99px; background: var(--grey-50); color: var(--grey-700); font-size: 10px; white-space: nowrap; }
    .summary-box { margin: 18px 0; padding: 16px; background: var(--grey-50); }
    .summary-box p { margin: 0; color: var(--grey-800); font-size: 13px; }
    .summary-box ul { margin: 0; padding-left: 18px; }
    .summary-box li { margin: 0 0 8px; color: var(--grey-800); }
    .summary-box li:last-child { margin-bottom: 0; }
    .rail-tabs { display: flex; gap: 16px; border-bottom: 1px solid var(--grey-200); }
    .rail-tab { min-height: 37px; padding: 0; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--grey-700); font-size: 11px; cursor: pointer; }
    .rail-tab.active { border-color: var(--black); color: var(--black); font-weight: 680; }
    .updates { margin-top: 12px; }
    .update { display: grid; grid-template-columns: 48px 12px minmax(0, 1fr); gap: 8px; padding: 9px 0; }
    .update time { color: var(--grey-500); font: 10px var(--mono); }
    .update .tick { width: 6px; height: 6px; margin-top: 5px; border-radius: 50%; background: var(--grey-300); }
    .update.active .tick { background: var(--orange-500); }
    .update p { margin: 0; color: var(--grey-700); font-size: 11px; }
    .update strong { color: var(--black); }
    .source-line { display: grid; grid-template-columns: 86px 1fr; gap: 8px; margin: 7px 0; font-size: 11px; }
    .source-line strong { color: var(--black); }
    .source-line span { color: var(--grey-700); }

    .usage-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 20px; margin-top: 28px; padding: 16px 0; border-top: 1px solid var(--grey-200); border-bottom: 1px solid var(--grey-200); }
    .usage-bar summary { cursor: pointer; font-weight: 680; }
    .usage-bar summary span { margin-left: 8px; color: var(--grey-700); font-weight: 400; }
    .coverage { display: flex; align-items: center; gap: 8px; color: var(--green); font-size: 11px; }
    .coverage::before { content: "✓"; font-weight: 800; }
    .usage-grid { display: grid; grid-template-columns: repeat(6, minmax(90px, 1fr)); gap: 18px; margin-top: 17px; }
    .usage-grid strong { display: block; font-size: 15px; }
    .usage-grid span { color: var(--grey-500); font-size: 10px; }

    /* B: compact operational ledger. */
    .variant-b .phase-line { margin-bottom: 18px; }
    .variant-b .workspace { grid-template-columns: minmax(620px, 1fr) 390px; gap: 0; border: 1px solid var(--grey-200); }
    .variant-b .roster { padding: 20px 22px; }
    .variant-b .rail { position: static; min-height: 610px; padding: 20px 22px; background: var(--grey-50); border-left: 1px solid var(--grey-200); }
    .variant-b .agent-row { grid-template-columns: 18px 155px minmax(210px, 1fr) 76px; }
    .variant-b .summary-box { background: var(--white); border: 1px solid var(--grey-200); }

    /* C: stage lanes with agents grouped by orchestration phase. */
    .variant-c .phase-line { display: none; }
    .variant-c .workspace { grid-template-columns: minmax(580px, 1.15fr) minmax(350px, .85fr); }
    .lane { margin-bottom: 22px; }
    .lane-head { display: grid; grid-template-columns: 90px minmax(0, 1fr) auto; gap: 12px; align-items: center; margin-bottom: 6px; color: var(--grey-500); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
    .lane-head::after { content: ""; height: 1px; background: var(--grey-200); }
    .lane-head span:last-child { order: 3; }
    .variant-c .agent-table { border-top: 0; }
    .variant-c .agent-row { min-height: 59px; grid-template-columns: 18px minmax(155px, .62fr) minmax(220px, 1fr) 76px; }
    .variant-c .rail { background: var(--white); }
    .all-summary { margin-top: 20px; border-top: 1px solid var(--grey-200); }
    .all-summary-row { width: 100%; padding: 12px 0; border: 0; border-bottom: 1px solid var(--grey-100); background: transparent; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 9px; align-items: start; text-align: left; cursor: pointer; }
    .all-summary-row:hover { color: var(--orange-700); }
    .all-summary-row strong { font-size: 11px; }
    .all-summary-row span { color: var(--grey-500); font-size: 10px; }

    /* Settings */
    .settings-layout { display: grid; grid-template-columns: 230px minmax(0, 760px); gap: 52px; align-items: start; }
    .settings-menu { position: sticky; top: 24px; display: grid; gap: 3px; }
    .settings-menu button { min-height: 38px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--grey-700); text-align: left; cursor: pointer; }
    .settings-menu button.active { background: var(--grey-50); color: var(--black); font-weight: 680; }
    .settings-section { margin-bottom: 44px; scroll-margin-top: 20px; }
    .settings-section h2 { margin: 0 0 5px; font-size: 18px; }
    .settings-section > p { margin: 0 0 21px; color: var(--grey-700); }
    .notice { display: flex; gap: 10px; margin-bottom: 22px; padding: 13px 14px; background: var(--orange-50); color: var(--grey-800); font-size: 12px; }
    .notice strong { color: var(--black); }
    .field { margin-bottom: 19px; }
    .field > label, .field-label { display: block; margin-bottom: 6px; font-weight: 650; }
    .field input, .field select { width: 100%; min-height: 42px; padding: 0 11px; border: 1px solid var(--grey-300); border-radius: 7px; background: var(--white); }
    .field-help { margin: 5px 0 0; color: var(--grey-700); font-size: 11px; }
    .connection-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .transport-card { margin: 15px 0; padding: 16px; border: 1px solid var(--grey-200); }
    .transport-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
    .transport-head strong { display: block; }
    .transport-head span { color: var(--grey-700); font-size: 11px; }
    .capability-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
    .capability { padding-top: 10px; border-top: 1px solid var(--grey-100); font-size: 10px; }
    .capability strong { display: block; font-size: 11px; }
    .capability strong.pending { color: var(--orange-700); }
    .ok { color: var(--green); }
    .warn { color: var(--orange-700); }
    .role-grid { border-top: 1px solid var(--grey-200); }
    .role-row { display: grid; grid-template-columns: minmax(180px, 1fr) 155px 170px; gap: 12px; align-items: center; min-height: 58px; border-bottom: 1px solid var(--grey-100); }
    .role-row strong { display: block; font-size: 12px; }
    .role-row span { color: var(--grey-500); font-size: 10px; }
    .role-row select { width: 100%; min-height: 36px; padding: 0 8px; border: 1px solid var(--grey-300); border-radius: 6px; background: var(--white); font-size: 11px; }
    .switch-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--grey-100); }
    .switch-row strong { display: block; font-size: 12px; }
    .switch-row p { margin: 3px 0 0; color: var(--grey-700); font-size: 11px; }
    .toggle { width: 38px; height: 22px; padding: 2px; border: 0; border-radius: 99px; background: var(--black); cursor: pointer; }
    .toggle::after { content: ""; display: block; width: 18px; height: 18px; margin-left: 16px; border-radius: 50%; background: var(--white); }
    .toggle.off { background: var(--grey-300); }
    .toggle.off::after { margin-left: 0; }
    .save-row { position: sticky; bottom: 0; display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 30px; padding: 15px 0; border-top: 1px solid var(--grey-200); background: rgba(255,255,255,.95); }

    .prototype-switcher { position: fixed; left: 50%; bottom: 19px; z-index: 20; transform: translateX(-50%); display: flex; align-items: center; gap: 3px; padding: 5px; border-radius: 99px; background: var(--black); color: var(--white); box-shadow: var(--shadow); }
    .prototype-switcher button { min-width: 36px; height: 34px; border: 0; border-radius: 99px; background: transparent; color: var(--white); cursor: pointer; }
    .prototype-switcher button:hover { background: rgba(255,255,255,.14); }
    .prototype-label { min-width: 230px; text-align: center; font-size: 11px; }
    .prototype-label strong { display: block; }
    .prototype-label span { color: #b9bec4; font-size: 9px; }

    @media (max-width: 1050px) {
      .shell { grid-template-columns: 74px minmax(0, 1fr); }
      .sidebar { padding-inline: 10px; }
      .brand span:last-child, .nav-button span:last-child, .nav-label, .sidebar-foot { display: none; }
      .brand { margin-left: 13px; }
      .nav-button { justify-content: center; }
      .workspace, .variant-b .workspace, .variant-c .workspace { grid-template-columns: 1fr; }
      .rail, .variant-b .rail { position: static; min-height: 0; padding: 26px 0 0; border: 0; border-top: 1px solid var(--grey-200); background: var(--white); }
      .settings-layout { grid-template-columns: 1fr; gap: 24px; }
      .settings-menu { position: static; grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 720px) {
      .shell { display: block; }
      .sidebar { display: none; }
      main { padding: 22px 16px 90px; }
      .page-head, .run-strip { grid-template-columns: 1fr; display: grid; }
      .run-totals { justify-content: space-between; }
      .phase-line { overflow-x: auto; grid-template-columns: repeat(5, minmax(110px, 1fr)); }
      .agent-row, .variant-b .agent-row, .variant-c .agent-row { grid-template-columns: 16px minmax(120px, .8fr) minmax(150px, 1fr); }
      .agent-row .state-block { justify-items: start; grid-column: 2 / -1; }
      .usage-grid { grid-template-columns: repeat(2, 1fr); }
      .connection-grid, .capability-list { grid-template-columns: 1fr; }
      .role-row { grid-template-columns: 1fr 1fr; padding: 10px 0; }
      .role-row > div:first-child { grid-column: 1 / -1; }
      .prototype-label { min-width: 180px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand"><span class="brand-mark">◆</span><span>XBRL Agent</span></div>
      <div class="nav-label">Workspace</div>
      <button class="nav-button"><span class="nav-icon">⌂</span><span>Work queue</span></button>
      <button class="nav-button active" data-page-link="run"><span class="nav-icon">◉</span><span>Live run</span></button>
      <button class="nav-button"><span class="nav-icon">✓</span><span>Review</span></button>
      <button class="nav-button"><span class="nav-icon">≡</span><span>Runs</span></button>
      <div class="nav-label">Administration</div>
      <button class="nav-button" data-page-link="settings"><span class="nav-icon">⚙</span><span>AI settings</span></button>
      <div class="sidebar-foot">Prototype · no live services<br>Direction A design system</div>
    </aside>
    <main>
      <div id="run-page" class="page"></div>
      <div id="settings-page" class="page hidden"></div>
    </main>
  </div>

  <div class="prototype-switcher" aria-label="Prototype variants">
    <button type="button" id="previous-variant" aria-label="Previous variant">←</button>
    <div class="prototype-label"><strong id="variant-name"></strong><span>Use ← and → to compare</span></div>
    <button type="button" id="next-variant" aria-label="Next variant">→</button>
  </div>

  <script>
    const scout = { id: "scout", group: "prepare", name: "Document scan", model: "GPT-5.6 Luna · Responses", task: "Page map saved", detail: "19 pages classified · 4 statements located", state: "done", label: "Complete", elapsedSeconds: 68, summary: ["Located the contents page and identified the Group financial statements.", "Mapped the statement of financial position to pages 8–9 and the income statement to page 10.", "Flagged 19 scanned note pages for source preparation before extraction."], source: "Pages 2, 8–19", tokens: "4,180" };
    const sourceRunning = { id: "source", group: "prepare", name: "Source preparation", model: "GPT-5.6 Luna · Responses", task: "Reading scanned note pages", detail: "9 of 19 complete · extraction waits for this source package", state: "running", label: "Working", elapsedSeconds: 164, completed: 9, total: 19, summary: ["Detected scanned note pages and began page-by-page transcription.", "Nine of 19 pages have produced structured source content.", "Extraction workers remain queued until the complete source package is available."], source: "Scanned pages 1–19", tokens: "11,620" };
    const sourceDone = { ...sourceRunning, task: "Structured source ready", detail: "19 pages prepared · extraction workers released", state: "done", label: "Complete", elapsedSeconds: 221, completed: 19, summary: ["Prepared structured source content for all 19 scanned note pages.", "Preserved note tables and page evidence for the extraction workers.", "Released the source package after every page reached a terminal outcome."], tokens: "24,860" };
    const extractionWork = [
      { id: "sofp", group: "extract", name: "Financial position", model: "GPT-5.6 Luna · Responses", task: "Checking comparative totals", detail: "27 facts captured · assets equation in progress", state: "running", label: "Working", elapsedSeconds: 161, summary: ["Selected the Group column because the run scope is Group.", "Matched current and comparative periods before writing facts.", "Assets currently reconcile; checking liabilities and equity before completing."], source: "Pages 8–9", tokens: "8,240" },
      { id: "sopl", group: "extract", name: "Profit or loss", model: "GPT-5.6 Luna · Responses", task: "Statement saved", detail: "18 facts captured · evidence links attached", state: "done", label: "Complete", elapsedSeconds: 114, summary: ["Used the consolidated income statement on page 10.", "Kept finance income separate from other income.", "Validated profit before tax against the note references."], source: "Page 10", tokens: "6,104" },
      { id: "soci", group: "extract", name: "Comprehensive income", model: "Claude Sonnet · LiteLLM", task: "Reading OCI components", detail: "Comparing reclassification adjustments", state: "running", label: "Working", elapsedSeconds: 138, summary: ["Detected a combined profit and OCI presentation.", "Separated items that may be reclassified from those that will not be reclassified.", "Verifying the tax effect before saving the remaining components."], source: "Page 11", tokens: "7,390" },
      { id: "socf", group: "extract", name: "Cash flows", model: "GPT-5.4 · Chat", task: "Waiting for extraction slot", detail: "Queued behind two active statement agents", state: "queued", label: "Queued", elapsedSeconds: null, summary: ["No provider reasoning summary yet. This worker has not started."], source: "Pages 13–14", tokens: "0" },
      { id: "socie", group: "extract", name: "Changes in equity", model: "GPT-5.6 Luna · Responses", task: "Waiting for extraction slot", detail: "Scope and template already prepared", state: "queued", label: "Queued", elapsedSeconds: null, summary: ["No provider reasoning summary yet. This worker has not started."], source: "Page 12", tokens: "0" },
      { id: "notes", group: "extract", name: "Disclosure notes", model: "GPT-5.6 Luna · Responses", task: "Extracting notes 1–8", detail: "2 of 5 note batches active", state: "running", label: "Working", elapsedSeconds: 97, summary: ["Split the disclosure notes into five page ranges for parallel reading.", "Corporate information and accounting policies have been routed to separate note templates.", "The current batch is preserving source table structure while extracting note 7."], source: "Pages 16–19", tokens: "12,880" }
    ];
    const downstreamWork = [
      { id: "checks", group: "check", name: "Cross-checks", model: "Deterministic", task: "Waiting for statements", detail: "Starts when required face statements finish", state: "queued", label: "Queued", elapsedSeconds: null, summary: ["This is a deterministic validation stage and does not produce a provider reasoning summary."], source: "Canonical facts", tokens: "0" },
      { id: "review", group: "review", name: "AI review", model: "GPT-5.6 Luna · Responses", task: "Waiting for cross-checks", detail: "Will inspect only grounded exceptions", state: "queued", label: "Queued", elapsedSeconds: null, summary: ["No provider reasoning summary yet. Review begins only if checks identify grounded issues or the configured spot-check applies."], source: "Not started", tokens: "0" }
    ];
    const extractionAgents = [scout, sourceDone, ...extractionWork, ...downstreamWork];
    const preparationAgents = [
      scout,
      sourceRunning,
      ...extractionWork.map(agent => ({ ...agent, state: "queued", label: "Queued", elapsedSeconds: null, task: "Waiting for source preparation", detail: "Starts when the scanned source package is ready", summary: ["No provider reasoning summary yet. This worker has not started."], tokens: "0" })),
      ...downstreamWork,
    ];
    let agents = preparationAgents;

    const variants = {
      a: { name: "A — Focused roster + evidence rail", className: "variant-a" },
      b: { name: "B — Compact operational ledger", className: "variant-b" },
      c: { name: "C — Orchestration lanes + all summaries", className: "variant-c" }
    };
    const variantKeys = Object.keys(variants);
    let selectedAgent = "source";
    let filter = "all";
    let railTab = "summary";
    const prototypeClockStartedAt = Date.now();

    function formatElapsed(seconds) {
      if (seconds == null) return "Not started";
      const minutes = Math.floor(seconds / 60);
      return `${String(minutes).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
    }

    function displayedElapsed(agent) {
      const liveSeconds = agent.elapsedSeconds == null ? null : agent.elapsedSeconds + (agent.state === "running" ? Math.floor((Date.now() - prototypeClockStartedAt) / 1000) : 0);
      return formatElapsed(liveSeconds);
    }

    function agentRows(items, variant) {
      return items.map(agent => `
        <button type="button" class="agent-row ${agent.id === selectedAgent ? "active" : ""}" data-agent="${agent.id}" data-state="${agent.state}" aria-pressed="${agent.id === selectedAgent}">
          <span class="status-dot ${agent.state}" aria-hidden="true"></span>
          <span class="name"><strong>${agent.name}</strong><span>${agent.model}</span></span>
          <span class="task"><strong>${agent.task}</strong><span>${agent.detail}</span></span>
          <span class="state-block"><span class="state ${agent.state}">${agent.label}</span><time class="elapsed" ${agent.state === "running" ? `data-live-elapsed="${agent.elapsedSeconds}"` : ""}>${displayedElapsed(agent)}</time></span>
          ${agent.total ? `<span class="progress-track" role="progressbar" aria-label="${agent.name} progress" aria-valuemin="0" aria-valuemax="${agent.total}" aria-valuenow="${agent.completed}"><span style="width:${Math.round((agent.completed / agent.total) * 100)}%"></span></span>` : ""}
        </button>`).join("");
    }

    function refreshElapsedTimes() {
      const added = Math.floor((Date.now() - prototypeClockStartedAt) / 1000);
      document.querySelectorAll("[data-live-elapsed]").forEach(time => {
        time.textContent = formatElapsed(Number(time.dataset.liveElapsed) + added);
      });
    }

    function activityMarkup(agent) {
      return `
        <div class="updates">
          <div class="update active"><time>03:42</time><span class="tick"></span><p><strong>${agent.task}</strong><br>${agent.detail}</p></div>
          <div class="update"><time>03:31</time><span class="tick"></span><p>Read ${agent.source.toLowerCase()} and updated the evidence map.</p></div>
          <div class="update"><time>03:18</time><span class="tick"></span><p>Prepared the canonical template and filing-scope context.</p></div>
        </div>`;
    }

    function reasoningMarkup(agent) {
      return `
        <div class="summary-box" aria-label="Provider reasoning summary">
          <ul>${agent.summary.map(line => `<li>${line}</li>`).join("")}</ul>
        </div>
        <div class="source-line"><strong>Evidence</strong><span>${agent.source}</span></div>
        <div class="source-line"><strong>Reasoning use</strong><span class="mono">${agent.tokens} tokens</span></div>
        <div class="source-line"><strong>Visibility</strong><span>${agent.state === "queued" ? "Waiting" : agent.model.includes("Responses") || agent.model.includes("Claude") ? "Provider summary" : "Activity only"}</span></div>`;
    }

    function railMarkup(variant) {
      const agent = agents.find(item => item.id === selectedAgent) || agents[0];
      const allSummary = variant === "c" ? `
        <div class="all-summary" aria-label="All worker summaries">
          <div class="eyebrow" style="margin-top:18px">All provider summaries</div>
          ${agents.filter(item => item.state === "running").map(item => `
            <button class="all-summary-row" data-agent="${item.id}">
              <span class="status-dot running"></span><strong>${item.name}<br><span>${item.summary[0]}</span></strong><span>Open</span>
            </button>`).join("")}
        </div>` : "";
      return `
        <aside class="rail" aria-label="Selected worker detail">
          <div class="rail-head">
            <div><div class="eyebrow">Selected worker</div><h2>${agent.name}</h2></div>
            <span class="provider-chip"><span class="status-dot ${agent.state}"></span>${agent.model}</span>
          </div>
          <div class="rail-tabs" role="tablist" aria-label="Worker detail">
            <button class="rail-tab ${railTab === "summary" ? "active" : ""}" data-rail-tab="summary" role="tab">Reasoning summary</button>
            <button class="rail-tab ${railTab === "activity" ? "active" : ""}" data-rail-tab="activity" role="tab">Activity</button>
          </div>
          <div id="rail-content">${railTab === "summary" ? reasoningMarkup(agent) : activityMarkup(agent)}</div>
          <details style="margin-top:20px" class="micro"><summary>Technical details</summary><p>Transport, retry count, model request IDs and the retained trace belong here. Raw private chain-of-thought is not returned by hosted OpenAI models.</p></details>
          ${allSummary}
        </aside>`;
    }

    function usageMarkup() {
      return `
        <section class="usage-bar" aria-label="Run usage and cost">
          <details>
            <summary>Usage and estimated final cost <span class="mono">$0.678</span></summary>
            <div class="usage-grid">
              <div><strong class="mono">98,420</strong><span>Input tokens</span></div>
              <div><strong class="mono">41,280</strong><span>Cached input</span></div>
              <div><strong class="mono">18,906</strong><span>Visible output</span></div>
              <div><strong class="mono">46,214</strong><span>Reasoning tokens</span></div>
              <div><strong class="mono">2</strong><span>Retried requests</span></div>
              <div><strong class="mono">$0.678</strong><span>All calls to date</span></div>
            </div>
          </details>
          <div class="coverage">All agents, helper passes and retries included</div>
        </section>`;
    }

    function laneMarkup(title, items, variant) {
      return `<section class="lane"><div class="lane-head"><strong>${title}</strong><span></span><span>${items.length}</span></div><div class="agent-table">${agentRows(items, variant)}</div></section>`;
    }

    function renderRun() {
      const params = new URLSearchParams(location.search);
      const variant = variants[params.get("variant")] ? params.get("variant") : "a";
      const moment = params.get("moment") === "extract" ? "extract" : "prepare";
      agents = moment === "extract" ? extractionAgents : preparationAgents;
      if (!agents.some(agent => agent.id === selectedAgent)) selectedAgent = moment === "extract" ? "sofp" : "source";
      const variantSpec = variants[variant];
      const runState = moment === "prepare"
        ? {
            title: "Preparing scanned note pages",
            detail: "Source preparation is reading page 9 of 19. Extraction workers will start when it finishes.",
            complete: "0 of 7",
            active: "1",
            elapsed: 232,
          }
        : {
            title: "Extracting statements and disclosure notes",
            detail: "Three workers are active. The completed source-preparation work remains visible below.",
            complete: "2 of 7",
            active: "3",
            elapsed: 472,
          };
      const visible = agents.filter(agent => filter === "all" || (filter === "working" ? agent.state === "running" : agent.state === "done"));
      const roster = variant === "c"
        ? laneMarkup("Prepare", visible.filter(a => a.group === "prepare"), variant)
          + laneMarkup("Extract", visible.filter(a => a.group === "extract"), variant)
          + laneMarkup("Check and review", visible.filter(a => a.group === "check" || a.group === "review"), variant)
        : `<div class="agent-table">${agentRows(visible, variant)}</div>`;
      document.getElementById("run-page").className = `page ${variantSpec.className}`;
      document.getElementById("run-page").innerHTML = `
        <header class="page-head">
          <div><div class="eyebrow">Live run · Run 214</div><h1>VTech Telecommunications (Malaysia) Sdn. Bhd.</h1><p>31 March 2025 · MFRS Group · RM ’000 · started 3 minutes ago</p></div>
          <div class="head-actions"><button class="button small ${moment === "prepare" ? "selected" : ""}" data-moment="prepare">Source preparation</button><button class="button small ${moment === "extract" ? "selected" : ""}" data-moment="extract">Extraction</button><button class="button small" data-page-link="settings">Reasoning settings</button><button class="button danger small">Stop all</button></div>
        </header>
        <section class="run-strip" aria-label="Current run status">
          <div class="run-now"><span class="status-dot running"></span><div><strong>${runState.title}</strong><p>${runState.detail}</p></div></div>
          <div class="run-totals"><div class="run-total"><strong>${runState.complete}</strong><span>workstreams complete</span></div><div class="run-total"><strong>${runState.active}</strong><span>currently active</span></div><div class="run-total"><strong class="mono" data-live-elapsed="${runState.elapsed}">${formatElapsed(runState.elapsed)}</strong><span>run elapsed</span></div></div>
        </section>
        <div class="phase-line" aria-label="Run stages"><div class="phase ${moment === "prepare" ? "active" : "done"}">Prepare document</div><div class="phase ${moment === "extract" ? "active" : ""}">Extract data</div><div class="phase">Combine and check</div><div class="phase">Review issues</div><div class="phase">Ready</div></div>
        <div class="workspace">
          <section class="roster" aria-labelledby="workers-heading">
            <div class="section-head"><div><h2 id="workers-heading">All workers</h2><div class="micro">Every planned worker remains visible from queue to completion.</div></div><div class="filters"><button class="filter ${filter === "all" ? "active" : ""}" data-filter="all">All</button><button class="filter ${filter === "working" ? "active" : ""}" data-filter="working">Working</button><button class="filter ${filter === "finished" ? "active" : ""}" data-filter="finished">Finished</button></div></div>
            ${roster}
          </section>
          ${railMarkup(variant)}
        </div>
        ${usageMarkup()}`;
      bindRunEvents();
    }

    const roles = [
      ["Document scan", "GPT-5.6", "Low", "Automatic"],
      ["Source preparation", "GPT-5.6", "Low", "Automatic"],
      ["Face statements", "GPT-5.6", "Medium", "Automatic"],
      ["Disclosure notes", "GPT-5.6", "Medium", "Automatic"],
      ["AI review", "GPT-5.6", "High", "Automatic"],
      ["Notes review", "GPT-5.6", "Medium", "Automatic"],
      ["Notes formatter", "GPT-5.4", "Low", "Off"]
    ];

    function renderSettings() {
      const params = new URLSearchParams(location.search);
      const variant = variants[params.get("variant")] ? params.get("variant") : "a";
      document.getElementById("settings-page").className = `page ${variants[variant].className}`;
      document.getElementById("settings-page").innerHTML = `
        <header class="page-head"><div><div class="eyebrow">Administration</div><h1>AI models and reasoning</h1><p>Configure transport, reasoning effort, summary visibility and usage capture for future runs.</p></div><button class="button small" data-page-link="run">Back to live run</button></header>
        <div class="settings-layout">
          <nav class="settings-menu" aria-label="Settings sections"><button class="active" data-scroll="connection">Connection</button><button data-scroll="transport">Transport</button><button data-scroll="reasoning">Reasoning</button><button data-scroll="telemetry">Telemetry</button></nav>
          <div>
            <div class="notice"><span>ⓘ</span><div><strong>Reasoning summaries are not private chain-of-thought.</strong><br>Hosted providers return a summary only when the selected model, transport and proxy support it.</div></div>
            <section class="settings-section" id="connection"><h2>Service connection</h2><p>Shared connection used by Windows and server deployments.</p><div class="connection-grid"><div class="field"><label for="service-url">LiteLLM service address</label><input id="service-url" value="https://genai-sharedservice-emea.pwc.com/v1"><p class="field-help">OpenAI-compatible enterprise gateway.</p></div><div class="field"><label for="default-model">Default model</label><select id="default-model"><option>openai.global.gpt-5.6-luna</option><option>openai.gpt-5.4</option></select><p class="field-help">Windows reported Python 3.13.12, LiteLLM 1.83.0, PydanticAI 2.9.0 and OpenAI 2.45.0.</p></div></div><button class="button small">Test connection and capabilities</button></section>
            <section class="settings-section" id="transport"><h2>OpenAI transport</h2><p>Select Responses when the proxy supports it. Automatic keeps Chat Completions as a safe fallback on unverified Windows gateways.</p><div class="field"><label for="transport-mode">Transport selection</label><select id="transport-mode"><option>Automatic — use Responses when verified</option><option>Responses API</option><option>Chat Completions compatibility mode</option></select></div><div class="transport-card"><div class="transport-head"><div><strong>Capability check</strong><span>Windows client verified · live ALM request still required</span></div><span class="provider-chip"><span class="status-dot attention"></span>Verification required</span></div><div class="capability-list"><div class="capability"><strong class="ok">✓ Client dependencies</strong>Supported versions installed</div><div class="capability"><strong class="pending">○ /v1/responses + tools</strong>Not tested against ALM</div><div class="capability"><strong class="pending">○ Summaries + usage</strong>Stream and final fields not tested</div></div></div><div class="switch-row"><div><strong>Fall back per model</strong><p>Use Chat Completions only when a selected model or proxy route does not support Responses.</p></div><button class="toggle" aria-label="Fall back per model"></button></div></section>
            <section class="settings-section" id="reasoning"><h2>Reasoning behaviour</h2><p>Effort controls computation. Visibility controls whether provider-supplied summaries appear in the run rail.</p><div class="role-grid"><div class="role-row" style="min-height:38px"><div><span>Pipeline role</span></div><span>Reasoning effort</span><span>Summary visibility</span></div>${roles.map(role => `<div class="role-row"><div><strong>${role[0]}</strong><span>${role[1]}</span></div><select aria-label="Reasoning effort for ${role[0]}"><option>${role[2]}</option><option>Provider default</option><option>None</option><option>Low</option><option>Medium</option><option>High</option></select><select aria-label="Summary visibility for ${role[0]}"><option>${role[3]}</option><option>Off</option><option>Automatic</option><option>Concise</option><option>Detailed</option></select></div>`).join("")}</div><p class="field-help">“Automatic” requests the most detailed summary that the provider supports and gracefully shows “Summary unavailable” when none is returned.</p></section>
            <section class="settings-section" id="telemetry"><h2>Usage and cost telemetry</h2><p>Define what must be captured before a run can claim that its final cost is complete.</p><div class="switch-row"><div><strong>Include every model call</strong><p>Agents, scout, note batches, reviewers, formatters, sidecars and helper calls.</p></div><button class="toggle" aria-label="Include every model call"></button></div><div class="switch-row"><div><strong>Include retries and failed attempts</strong><p>Costs remain visible even when an attempt is discarded and restarted.</p></div><button class="toggle" aria-label="Include retries and failed attempts"></button></div><div class="switch-row"><div><strong>Capture provider usage details</strong><p>Input, cached input, visible output and reasoning-token subsets.</p></div><button class="toggle" aria-label="Capture provider usage details"></button></div><div class="switch-row"><div><strong>Retain provider reasoning summaries</strong><p>Store summaries with the run trace for 90 days. These may contain sensitive financial inferences.</p></div><button class="toggle off" aria-label="Retain provider reasoning summaries"></button></div></section>
            <div class="save-row"><span class="micro">Changes affect future runs for all users.</span><button class="button primary">Save AI settings</button></div>
          </div>
        </div>`;
      bindPageLinks();
      document.querySelectorAll("[data-scroll]").forEach(button => button.addEventListener("click", () => document.getElementById(button.dataset.scroll).scrollIntoView({ behavior: "smooth" })));
      document.querySelectorAll(".toggle").forEach(toggle => toggle.addEventListener("click", () => toggle.classList.toggle("off")));
    }

    function bindRunEvents() {
      document.querySelectorAll("[data-agent]").forEach(button => button.addEventListener("click", () => { selectedAgent = button.dataset.agent; renderRun(); }));
      document.querySelectorAll("[data-filter]").forEach(button => button.addEventListener("click", () => { filter = button.dataset.filter; renderRun(); }));
      document.querySelectorAll("[data-rail-tab]").forEach(button => button.addEventListener("click", () => { railTab = button.dataset.railTab; renderRun(); }));
      document.querySelectorAll("[data-moment]").forEach(button => button.addEventListener("click", () => {
        const params = new URLSearchParams(location.search);
        params.set("moment", button.dataset.moment);
        history.replaceState(null, "", `${location.pathname}?${params}`);
        selectedAgent = button.dataset.moment === "prepare" ? "source" : "sofp";
        renderRun();
      }));
      bindPageLinks();
    }

    function setPage(page) {
      const params = new URLSearchParams(location.search);
      params.set("page", page);
      history.replaceState(null, "", `${location.pathname}?${params}`);
      document.getElementById("run-page").classList.toggle("hidden", page !== "run");
      document.getElementById("settings-page").classList.toggle("hidden", page !== "settings");
      document.querySelectorAll("[data-page-link]").forEach(button => button.classList.toggle("active", button.dataset.pageLink === page));
      if (page === "settings") renderSettings(); else renderRun();
      scrollTo({ top: 0, behavior: "instant" });
    }

    function bindPageLinks() { document.querySelectorAll("[data-page-link]").forEach(button => button.onclick = () => setPage(button.dataset.pageLink)); }

    function setVariant(next) {
      const params = new URLSearchParams(location.search);
      params.set("variant", next);
      history.replaceState(null, "", `${location.pathname}?${params}`);
      document.getElementById("variant-name").textContent = variants[next].name;
      const page = params.get("page") === "settings" ? "settings" : "run";
      if (page === "settings") renderSettings(); else renderRun();
    }

    function cycleVariant(direction) {
      const params = new URLSearchParams(location.search);
      const current = variants[params.get("variant")] ? params.get("variant") : "a";
      const next = variantKeys[(variantKeys.indexOf(current) + direction + variantKeys.length) % variantKeys.length];
      setVariant(next);
    }

    document.getElementById("previous-variant").addEventListener("click", () => cycleVariant(-1));
    document.getElementById("next-variant").addEventListener("click", () => cycleVariant(1));
    document.addEventListener("keydown", event => {
      if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
      if (event.key === "ArrowLeft") cycleVariant(-1);
      if (event.key === "ArrowRight") cycleVariant(1);
    });

    const initialParams = new URLSearchParams(location.search);
    const initialVariant = variants[initialParams.get("variant")] ? initialParams.get("variant") : "a";
    if (!initialParams.get("variant")) initialParams.set("variant", initialVariant);
    if (!initialParams.get("page")) initialParams.set("page", "run");
    if (!initialParams.get("moment")) initialParams.set("moment", "prepare");
    history.replaceState(null, "", `${location.pathname}?${initialParams}`);
    document.getElementById("variant-name").textContent = variants[initialVariant].name;
    bindPageLinks();
    setPage(initialParams.get("page"));
    refreshElapsedTimes();
    setInterval(refreshElapsedTimes, 1000);
  </script>
</body>
</html>
