<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="interaction-style" content="Interactive states use surface, text and icon changes; never accent edge or underline indicators">
  <title>XBRL Agent — UI direction prototype</title>
  <!--
    PROTOTYPE — throwaway, not production.
    Three full-product UI directions, switchable via ?variant=a|b|c.
    Use the product navigation to inspect Work queue, New extraction,
    Live run, Figures review, Notes review, and Runs.
  -->
  <style>
    :root {
      /* PwC 2025 visual identity: signature orange, black, neutral greys, white. */
      --ink: #000000;
      --text: #000000;
      --muted: rgba(0, 0, 0, .64);
      --faint: rgba(0, 0, 0, .46);
      --grey-500: #6b7280;
      --grey-400: #b5bcc4;
      --grey-300: #cbd1d6;
      --grey-200: #dfe3e6;
      --grey-100: #eeeff1;
      --grey-50: #f5f7f8;
      --line: var(--grey-200);
      --line-strong: var(--grey-300);
      --canvas: #ffffff;
      --surface: #ffffff;
      --surface-2: var(--grey-50);
      --orange-700: #d64000;
      --orange-500: #fd5108;
      --orange-400: #fe7c39;
      --orange-300: #ffaa72;
      --orange-200: #ffcda8;
      --orange-100: #ffe8d4;
      --orange-50: #fff5ed;
      --accent: var(--orange-500);
      --accent-400: var(--orange-400);
      --accent-300: var(--orange-300);
      --accent-200: var(--orange-200);
      --accent-100: var(--orange-100);
      --accent-soft: var(--orange-50);
      --success: #000000;
      --success-soft: var(--grey-50);
      --warning: var(--orange-500);
      --warning-soft: var(--orange-50);
      --danger: var(--orange-500);
      --danger-soft: var(--orange-50);
      --info: #000000;
      --radius-sm: 6px;
      --radius: 10px;
      --radius-lg: 16px;
      --shadow-float: 0 14px 40px rgba(24, 24, 22, .13);
      --sans: "Inter Variable", Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }
    button { color: inherit; }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); }
    .mono { font-family: var(--mono); font-size: 12px; }
    .num { font-variant-numeric: tabular-nums; text-align: right; }
    .nowrap { white-space: nowrap; }
    .hidden { display: none !important; }

    /* Shared atoms. The three directions deliberately do not share a shell. */
    .mark {
      width: 27px; height: 27px; display: inline-flex; align-items: center;
      justify-content: center; color: var(--accent); flex: 0 0 auto;
    }
    .mark svg { width: 100%; height: 100%; }
    .button {
      min-height: 40px; padding: 0 15px; border-radius: 8px;
      border: 1px solid var(--line-strong); background: var(--surface);
      color: var(--ink); font-weight: 620; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      transition: background-color .14s cubic-bezier(.2,0,0,1), border-color .14s cubic-bezier(.2,0,0,1), color .14s cubic-bezier(.2,0,0,1), transform .1s cubic-bezier(.2,0,0,1);
    }
    .button:hover { border-color: var(--grey-500); background: var(--canvas); }
    .button.primary { background: var(--accent); border-color: var(--accent); color: var(--ink); }
    .button.primary:hover { background: var(--accent-400); border-color: var(--accent-400); }
    .button:active { transform: translateY(1px); }
    .button.accent { background: var(--accent); border-color: var(--accent); color: var(--ink); }
    .button.small { min-height: 34px; padding: 0 12px; font-size: 13px; }
    .button.quiet { border-color: transparent; background: transparent; }
    .button.danger { color: var(--danger); background: transparent; border-color: transparent; }
    .icon-button { width: 36px; height: 36px; padding: 0; border-radius: 8px; }
    .pill, .status {
      display: inline-flex; align-items: center; gap: 7px; min-height: 24px;
      padding: 2px 9px; border: 1px solid var(--line); border-radius: 999px;
      color: var(--text); background: var(--surface); font-size: 12px; white-space: nowrap;
    }
    .status { border: 0; padding: 0; background: transparent; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
    .dot.active { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .dot.success { background: var(--success); }
    .dot.warning { background: var(--accent); }
    .dot.danger { background: var(--danger); }
    .card { background: transparent; border: 0; border-radius: 0; }
    .section-title { margin: 0; color: var(--ink); font-size: 17px; letter-spacing: -.015em; }
    .eyebrow { color: var(--muted); font-size: 11px; font-weight: 680; letter-spacing: .08em; text-transform: uppercase; }
    .divider { height: 1px; background: var(--line); }
    .inline-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .kebab { letter-spacing: 2px; transform: translateY(-1px); }
    .plain-link { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .avatar {
      width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%;
      background: var(--ink); color: white; font-size: 11px; font-weight: 700;
    }

    .page-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
    .page-heading h1 { margin: 0; color: var(--ink); font-size: clamp(24px, 2.2vw, 34px); line-height: 1.15; letter-spacing: -.035em; }
    .page-heading p { max-width: 650px; margin: 9px 0 0; color: var(--muted); font-size: 15px; }
    .page-actions { display: flex; align-items: center; gap: 8px; }
    .page-content { display: grid; gap: 28px; }

    .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(18px, 4vw, 52px); }
    .stat { padding: 8px 0; }
    .stat .value { margin-top: 5px; color: var(--ink); font-size: 24px; letter-spacing: -.03em; }
    .stat .detail { margin-top: 4px; color: var(--muted); font-size: 12px; }

    .list { display: grid; gap: 0; border-top: 1px solid var(--line); }
    .list-row {
      width: calc(100% + 24px); margin-left: -12px; display: grid; align-items: center; gap: 12px; padding: 14px 12px;
      border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent;
      text-align: left; cursor: pointer;
    }
    .list-row:hover, .list-row:focus-visible { background: transparent; }
    .list-row:hover .row-action, .list-row:focus-visible .row-action { text-decoration: underline; text-underline-offset: 3px; }
    .list-row strong { color: var(--ink); font-weight: 640; }
    .run-row { grid-template-columns: minmax(260px, 1.5fr) 110px 140px 150px 92px 82px; }
    .row-action { justify-self: end; color: var(--ink); font-weight: 620; white-space: nowrap; }
    .row-sub { margin-top: 3px; color: var(--muted); font-size: 12px; }

    .upload-zone {
      min-height: 230px; border: 1.5px dashed var(--line-strong); border-radius: var(--radius-lg);
      background: var(--surface); display: grid; place-items: center; padding: 34px;
      text-align: center; cursor: pointer;
    }
    .upload-zone:hover { border-color: var(--grey-500); background: var(--surface-2); }
    .upload-icon { width: 46px; height: 56px; margin: 0 auto 18px; border: 1.5px solid var(--line-strong); border-radius: 5px; position: relative; background: white; }
    .upload-icon:before { content: ""; position: absolute; left: 10px; right: 10px; top: 18px; height: 1px; background: var(--line-strong); box-shadow: 0 8px 0 var(--line-strong), 0 16px 0 var(--line-strong); }
    .upload-zone h2 { margin: 0 0 7px; color: var(--ink); font-size: 18px; }
    .upload-zone p { margin: 0 0 18px; color: var(--muted); }
    .config-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 18px; }
    .field label { display: block; margin: 0 0 7px; color: var(--text); font-size: 13px; font-weight: 620; }
    .field select, .field input {
      width: 100%; min-height: 42px; padding: 0 12px; border: 1px solid var(--line-strong);
      border-radius: 8px; background: white; color: var(--ink);
    }
    .check-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 18px; }
    .check { display: flex; align-items: center; gap: 9px; min-height: 34px; }
    .check input { accent-color: var(--accent); width: 16px; height: 16px; }

    .run-hero { padding: 22px 0 10px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 20px; align-items: center; }
    .run-title { display: flex; align-items: center; gap: 11px; }
    .run-title h1 { margin: 0; color: var(--ink); font-size: 25px; letter-spacing: -.025em; }
    .run-meta { margin-top: 6px; color: var(--muted); font-size: 13px; }
    .progress-bar { height: 4px; border-radius: 999px; overflow: hidden; background: var(--surface-2); }
    .progress-bar span { display: block; height: 100%; width: 68%; background: var(--accent); }

    .scenario-switch { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
    .scenario-switch button { border: 0; background: transparent; padding: 7px 10px; border-radius: 6px; color: var(--muted); cursor: pointer; font-size: 12px; }
    .scenario-switch button.active { background: var(--surface-2); color: var(--ink); font-weight: 650; }

    .stage-list { display: grid; }
    .stage-row { display: grid; grid-template-columns: 28px minmax(0,1fr) auto; gap: 12px; padding: 12px 0; align-items: start; }
    .stage-icon { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; color: var(--muted); font-size: 11px; }
    .stage-row.done .stage-icon { background: var(--ink); border-color: var(--ink); color: white; }
    .stage-row.active .stage-icon { border-color: var(--accent); color: var(--accent); }
    .stage-row h3 { margin: 1px 0 4px; color: var(--ink); font-size: 14px; }
    .stage-row p { margin: 0; color: var(--muted); font-size: 12px; }

    .workstreams { display: grid; grid-template-columns: 235px minmax(0,1fr); gap: 26px; min-height: 480px; }
    .workstream-nav { padding: 0; background: transparent; }
    .workstream-nav button { width: 100%; border: 0; padding: 10px 11px; border-radius: 7px; background: transparent; text-align: left; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .workstream-nav button.active { background: var(--surface); }
    .workstream-body { padding: 2px 0; }
    .activity-log { margin-top: 14px; }
    .event { display: grid; grid-template-columns: 58px 22px 1fr; gap: 10px; padding: 11px 0; }
    .event time { color: var(--faint); font-family: var(--mono); font-size: 11px; }
    .event .event-line { width: 7px; height: 7px; margin-top: 5px; border-radius: 50%; background: var(--line-strong); }
    .event.active .event-line { background: var(--accent); }
    .event strong { display: block; color: var(--ink); font-size: 13px; }
    .event p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }

    /* Direction A live run: parallel agents first, technical telemetry on demand. */
    .agent-run-time { color: var(--muted); font: 12px var(--mono); white-space: nowrap; }
    .agent-workspace { display: grid; grid-template-columns: minmax(560px, 1.42fr) minmax(320px, .78fr); gap: clamp(28px, 3vw, 48px); align-items: start; min-width: 0; }
    .agent-roster { min-width: 0; }
    .agent-roster-head { min-height: 42px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .agent-roster-head h2 { margin: 0; color: var(--ink); font-size: 17px; }
    .agent-roster-title p { margin: 2px 0 0; color: var(--muted); font-size: 10px; }
    .agent-filter { display: flex; gap: 3px; }
    .agent-filter button { min-height: 30px; padding: 0 9px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 11px; cursor: pointer; }
    .agent-filter button:hover, .agent-filter button.active { background: var(--surface-2); color: var(--ink); }
    .agent-filter button.active { font-weight: 650; }
    .agent-list { display: grid; gap: 2px; margin-top: 7px; }
    .agent-row { width: 100%; min-height: 58px; padding: 8px 9px; border: 0; border-radius: 8px; background: transparent; display: grid; grid-template-columns: 20px minmax(145px,.58fr) minmax(220px,1fr) 72px; gap: 11px; align-items: center; text-align: left; cursor: pointer; }
    .agent-row:hover, .agent-row.active { background: var(--surface-2); }
    .agent-row > .dot { justify-self: center; }
    .agent-row.child { position: relative; width: calc(100% - 24px); margin-left: 24px; }
    .agent-row.child::before { content: ""; position: absolute; left: -12px; top: 0; bottom: 0; width: 1px; background: var(--grey-200); }
    .agent-row.child::after { content: ""; position: absolute; left: -12px; top: 29px; width: 12px; height: 1px; background: var(--grey-200); }
    .agent-row[data-agent-state="working"] > .dot { animation: agent-pulse 1.8s ease-in-out infinite; }
    .agent-row[data-agent-state="working"]:nth-child(2) > .dot { animation-delay: -.45s; }
    .agent-row[data-agent-state="working"]:nth-child(3) > .dot { animation-delay: -.9s; }
    .agent-row[data-agent-state="working"]:nth-child(4) > .dot { animation-delay: -1.35s; }
    @keyframes agent-pulse { 0%, 100% { box-shadow: 0 0 0 2px var(--accent-soft); } 50% { box-shadow: 0 0 0 5px var(--accent-soft); } }
    .agent-identity, .agent-task { min-width: 0; }
    .agent-identity strong, .agent-task strong { display: block; overflow: hidden; color: var(--ink); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .agent-identity span, .agent-task span { display: block; margin-top: 2px; overflow: hidden; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .agent-row-state { justify-self: end; color: var(--muted); font-size: 10px; white-space: nowrap; }
    .agent-row[data-agent-state="working"] .agent-row-state { color: var(--ink); }
    .agent-detail { position: sticky; top: 88px; min-width: 0; padding: 7px 0 8px 30px; border-left: 1px solid var(--grey-100); }
    .agent-detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
    .agent-detail h2 { margin: 0; color: var(--ink); font-size: 19px; letter-spacing: -.02em; }
    .agent-detail-role { margin-top: 3px; color: var(--muted); font-size: 10px; }
    .agent-detail-copy { margin: 14px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .agent-now { min-height: 38px; margin-top: 18px; display: flex; align-items: center; gap: 9px; color: var(--ink); font-size: 11px; font-weight: 650; }
    .agent-now small { margin-left: auto; color: var(--muted); font-size: 10px; font-weight: 500; }
    .agent-focus { margin-top: 20px; }
    .agent-focus strong { display: block; color: var(--ink); font-size: 13px; }
    .agent-focus p { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .agent-focus span { display: block; margin-top: 7px; color: var(--faint); font-size: 10px; }
    .agent-detail-section { margin-top: 24px; }
    .agent-detail-section h3 { margin: 0 0 9px; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
    .agent-updates { display: grid; gap: 12px; }
    .agent-update { display: grid; grid-template-columns: 50px minmax(0,1fr); gap: 10px; color: var(--ink); font-size: 11px; }
    .agent-update time { color: var(--faint); font: 10px var(--mono); }
    .agent-links { display: grid; grid-template-columns: 88px minmax(0,1fr); gap: 7px 10px; color: var(--muted); font-size: 10px; }
    .agent-links strong { color: var(--ink); font-weight: 620; }
    .agent-handoff { display: flex; align-items: center; gap: 7px; min-width: 0; color: var(--muted); font-size: 10px; }
    .agent-handoff span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .agent-handoff strong { color: var(--ink); font-weight: 650; white-space: nowrap; }
    .agent-handoff b { color: var(--grey-400); font-weight: 500; }
    .agent-technical { margin-top: 22px; color: var(--muted); font-size: 10px; }
    .agent-technical summary { width: max-content; cursor: pointer; }
    .agent-technical p { margin: 8px 0 0; font-family: var(--mono); line-height: 1.6; }

    .live-run-primary { width: min(1000px, 100%); }
    .live-work { margin-top: 0; }
    .live-work-head { min-height: 38px; display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 5px; }
    .live-work-head h2 { margin: 0; color: var(--ink); font-size: 17px; }
    .live-work-head span { color: var(--muted); font-size: 11px; }
    .agent-tree { display: grid; gap: 2px; }
    .agent-tree-row, .agent-group > summary, .agent-child > summary {
      min-height: 54px; padding: 7px 10px; border-radius: 8px; display: grid;
      grid-template-columns: 18px minmax(175px,.62fr) minmax(260px,1fr) auto 14px;
      gap: 12px; align-items: center;
    }
    .agent-tree-row strong, .agent-group > summary strong, .agent-child > summary strong { color: var(--ink); font-size: 12px; }
    .agent-tree-row > span:nth-child(3), .agent-group > summary > span:nth-child(3), .agent-child > summary > span:nth-child(3) { color: var(--muted); font-size: 11px; }
    .agent-tree-meta { color: var(--faint); font-size: 10px; white-space: nowrap; }
    .agent-tree-row { grid-template-columns: 18px minmax(175px,.62fr) minmax(260px,1fr) auto 14px; }
    .agent-tree-row .row-end { color: var(--faint); font-size: 11px; }
    .agent-group, .agent-child { border-radius: 8px; }
    .agent-group > summary, .agent-child > summary { cursor: pointer; list-style: none; }
    .agent-group > summary::-webkit-details-marker, .agent-child > summary::-webkit-details-marker { display: none; }
    .agent-group > summary:focus, .agent-child > summary:focus { outline: 0; }
    .agent-group > summary:focus-visible, .agent-child > summary:focus-visible { outline: 1px solid var(--grey-500); outline-offset: -1px; }
    .agent-group > summary:hover, .agent-group[open] > summary, .agent-child > summary:hover, .agent-child[open] > summary { background: var(--surface-2); }
    .agent-tree-chevron { color: var(--faint); font-size: 13px; transform-origin: center; transition: transform .14s ease; }
    .agent-group[open] > summary .agent-tree-chevron, .agent-child[open] > summary .agent-tree-chevron { transform: rotate(90deg); }
    .agent-children { position: relative; margin: 0 0 5px 28px; padding: 2px 0 2px 20px; }
    .agent-children::before { content: ""; position: absolute; left: 7px; top: 0; bottom: 13px; width: 1px; background: var(--grey-200); }
    .agent-child { position: relative; }
    .agent-child::before { content: ""; position: absolute; left: -13px; top: 27px; width: 12px; height: 1px; background: var(--grey-200); }
    .agent-child > summary { grid-template-columns: 18px minmax(165px,.58fr) minmax(240px,1fr) auto 14px; min-height: 50px; }
    .agent-child-events { margin: -1px 10px 12px 40px; padding-left: 14px; }
    .semantic-event { position: relative; display: grid; grid-template-columns: 38px minmax(0,1fr); gap: 10px; min-height: 26px; color: var(--ink); font-size: 10px; }
    .semantic-event::before { content: ""; position: absolute; left: -14px; top: 7px; width: 5px; height: 5px; border-radius: 50%; background: var(--grey-400); }
    .semantic-event:first-child::before { background: var(--accent); }
    .semantic-event time { color: var(--faint); font: 9px var(--mono); }
    .agent-child-context { margin-top: 6px; display: flex; gap: 16px; flex-wrap: wrap; color: var(--faint); font-size: 10px; }
    .agent-child-context strong { color: var(--ink); font-weight: 580; }
    .agent-technical-inline { margin-top: 8px; color: var(--faint); font-size: 9px; }
    .agent-technical-inline summary { width: max-content; cursor: pointer; }
    .agent-technical-inline p { margin: 5px 0 0; color: var(--muted); }
    .agent-group-note { margin: -1px 10px 10px 40px; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .agent-group-note strong { color: var(--ink); font-weight: 620; }
    .agent-tree-row.attention { background: var(--accent-soft); }

    .attention-banner { display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px; border: 0; border-radius: 10px; background: var(--accent-soft); }
    .attention-banner > span:first-child { width: 22px; height: 22px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 50%; background: var(--accent); color: var(--ink); font-weight: 750; }
    .attention-banner strong { color: var(--ink); display: block; margin-bottom: 2px; }
    .attention-banner p { margin: 0; color: var(--muted); font-size: 13px; }

    .review-grid { display: grid; grid-template-columns: 240px minmax(520px, 1fr) minmax(300px, 34%); gap: clamp(20px, 2.5vw, 38px); min-height: 650px; }
    .review-queue { align-self: start; background: transparent; }
    .review-pane-head { padding: 0 6px 10px; }
    .review-pane-head h2 { margin: 0; color: var(--ink); font-size: 14px; }
    .review-pane-head p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .issue { width: 100%; margin: 2px 0; padding: 13px 12px; border: 0; border-radius: 8px; background: transparent; text-align: left; cursor: pointer; }
    .issue.active { background: var(--accent-soft); }
    .issue-title { display: flex; gap: 8px; align-items: center; color: var(--ink); font-weight: 630; font-size: 13px; }
    .issue p { margin: 5px 0 0 15px; color: var(--muted); font-size: 11px; }
    .sheet { min-width: 0; }
    .sheet-toolbar { min-height: 60px; padding: 0 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    /* Source-first review: editable filing surface + persistent PDF, with metadata on demand. */
    .source-review-page { display: grid; gap: 16px; }

    .compact-review-bar { min-height: 42px; display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
    .sheet-picker { position: relative; }

    .sheet-picker-menu { position: absolute; top: 42px; left: 0; z-index: 35; min-width: 260px; padding: 7px; border-radius: 9px; background: white; box-shadow: var(--shadow-float); }
    .sheet-picker-menu button { width: 100%; min-height: 34px; padding: 0 9px; border: 0; border-radius: 6px; background: transparent; text-align: left; cursor: pointer; }

    .note-index { position: relative; }

    .note-index-coverage { color: var(--muted); font-size: 11px; font-weight: 450; }
    .note-index-panel { position: absolute; top: 44px; left: 0; z-index: 38; width: min(430px, calc(100vw - 40px)); max-height: min(680px, calc(100vh - 150px)); padding: 14px; border-radius: 10px; background: white; box-shadow: var(--shadow-float); display: flex; flex-direction: column; }

    .note-index-search { width: 100%; min-height: 38px; padding: 0 11px; border: 0; border-radius: 7px; background: var(--surface-2); color: var(--ink); }

    .note-index-filters button { min-height: 30px; padding: 0 9px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 11px; cursor: pointer; }
    .note-index-filters button.active { background: var(--surface-2); color: var(--ink); font-weight: 650; }
    .note-index-list { min-height: 0; overflow-y: auto; display: grid; gap: 1px; }

    .note-index-status { color: var(--muted); font-size: 10px; white-space: nowrap; }
    .note-index-status .checkmark { color: var(--ink); margin-right: 4px; }
    .notes-three-pane { display: grid; grid-template-columns: 240px 9px minmax(410px, 1fr) 9px minmax(330px, 35%); gap: 0; align-items: start; min-width: 0; }
    .pane-resizer { align-self: stretch; min-height: 500px; display: flex; justify-content: center; cursor: col-resize; }
    .pane-resizer::before { content: ""; width: 1px; min-height: 100%; background: var(--grey-100); }
    .note-rail { position: sticky; top: 78px; height: calc(100vh - 174px); min-height: 500px; display: flex; flex-direction: column; min-width: 0; }

    .note-rail-list { min-height: 0; margin-top: 7px; overflow-y: auto; display: grid; gap: 1px; padding-right: 3px; }
    .note-nav-row { width: 100%; min-height: 38px; padding: 5px 6px; border: 0; border-radius: 7px; background: transparent; display: grid; grid-template-columns: 22px minmax(0,1fr) 14px; gap: 6px; align-items: center; text-align: left; cursor: pointer; }
    .note-nav-row:hover { background: var(--surface-2); }
    .note-nav-row.active { background: var(--surface-2); }
    .note-nav-number { color: var(--faint); font: 10px var(--mono); text-align: right; }
    .note-nav-copy { min-width: 0; }

    .note-nav-page { display: block; margin-top: 1px; color: var(--faint); font-size: 9px; }
    .note-nav-state { color: var(--faint); font-size: 10px; text-align: center; }
    .note-editor-pane { position: relative; min-width: 0; padding: 0 18px; }
    .xbrl-sheet-nav { position: sticky; top: 64px; z-index: 20; min-height: 48px; display: flex; align-items: center; gap: 4px; padding: 8px 0 12px; border-bottom: 1px solid var(--grey-100); background: white; }

    .xbrl-field.selected { background: var(--accent-soft); }

    .note-editor-pane .editor-tools { position: absolute; top: 38px; left: 8px; z-index: 12; width: max-content; min-height: 38px; padding: 4px; border-radius: 8px; background: white; box-shadow: 0 8px 24px rgba(0,0,0,.12); opacity: 0; pointer-events: none; transform: translateY(-4px); transition: opacity .14s ease, transform .14s ease; }

    .review-tool { width: 34px; height: 34px; padding: 0; border: 0; border-radius: 7px; background: transparent; cursor: pointer; }
    .review-tool:hover { background: var(--surface-2); }
    .review-tool .mini-warning { cursor: pointer; }
    .template-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 8px 0 10px; }
    .template-heading h2 { margin: 0; color: var(--ink); font-size: 17px; }

    .source-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; }
    .source-table th { padding: 9px 10px; background: var(--surface-2); color: var(--muted); text-align: left; font-size: 11px; font-weight: 620; }
    .source-table th.num { text-align: right; }
    .source-table td { padding: 7px 10px; border-bottom: 1px solid var(--grey-100); }

    .source-jump.selected-row td { background: var(--accent-soft); }

    .hidden-meta { margin-top: 12px; color: var(--muted); font-size: 11px; }

    .source-preview { position: sticky; top: 78px; height: calc(100vh - 174px); min-height: 500px; display: flex; flex-direction: column; overflow: hidden; background: white; }

    .a-nav button { width: 100%; min-height: 38px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; text-align: left; color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background-color .14s cubic-bezier(.2,0,0,1), color .14s cubic-bezier(.2,0,0,1), transform .1s cubic-bezier(.2,0,0,1); }
    .a-nav button:hover { color: var(--ink); background: rgba(255,255,255,.55); }
    .a-nav button.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(24,24,22,.04); font-weight: 640; }
    .a-nav button.active .nav-glyph { color: var(--accent); }
    .nav-glyph { width: 18px; color: var(--faint); text-align: center; }
    .shell-a .button.primary { background: var(--ink); border-color: var(--ink); color: white; }
    .shell-a .button.primary:hover { background: var(--ink); border-color: var(--ink); color: white; opacity: .86; }
    .shell-a .button.primary:focus-visible { outline-color: var(--accent); }
    .a-sidebar-foot { margin-top: auto; padding: 14px 8px 0; display: flex; align-items: center; gap: 9px; }
    .a-app { min-width: 0; }
    .a-topbar { height: 64px; padding: 0 30px; background: rgba(255,255,255,.94); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; backdrop-filter: blur(12px); }
    .breadcrumb { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .breadcrumb strong { color: var(--ink); }
    .a-main { padding: 34px clamp(28px, 4vw, 62px) 110px; max-width: 1500px; margin: 0 auto; }
    .shell-a.is-collapsed { grid-template-columns: 72px minmax(0,1fr); }
    .shell-a.is-collapsed .a-sidebar { padding: 16px 8px; }
    .shell-a.is-collapsed .a-brand { justify-content: center; padding: 2px 0 22px; }
    .shell-a.is-collapsed .a-brand > span, .shell-a.is-collapsed .a-nav-label, .shell-a.is-collapsed .a-sidebar-foot > div { display: none; }
    .shell-a.is-collapsed .a-rail-toggle { margin-left: 0; }
    .shell-a.is-collapsed .a-nav button { justify-content: center; padding: 0; }
    .shell-a.is-collapsed .a-nav button > span:last-child { display: none; }
    .shell-a.is-collapsed .a-sidebar-foot { justify-content: center; padding-left: 0; padding-right: 0; }
    .shell-a.is-collapsed .a-main { max-width: none; padding-left: 28px; padding-right: 28px; }

    /* Direction B — document studio: top shell + context rail. */
    .shell-b { min-height: 100vh; background: var(--canvas); }
    .b-topbar { height: 60px; padding: 0 22px; background: #000000; color: white; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 12; }
    .b-brand { display: flex; align-items: center; gap: 10px; font-weight: 710; }
    .b-topbar .mark { width: 24px; height: 24px; }
    .b-global { display: flex; align-items: center; gap: 4px; }
    .b-global button { min-height: 34px; padding: 0 12px; border: 0; border-radius: 6px; color: var(--grey-300); background: transparent; cursor: pointer; }
    .b-global button.active { background: rgba(255,255,255,.14); color: white; }
    .b-toolbar { min-height: 58px; padding: 10px 22px; background: white; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .b-route { display: flex; align-items: center; gap: 18px; overflow-x: auto; }
    .b-route button { min-height: 35px; padding: 0 11px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; white-space: nowrap; transition: background-color .14s cubic-bezier(.2,0,0,1), color .14s cubic-bezier(.2,0,0,1), transform .1s cubic-bezier(.2,0,0,1); }
    .b-route button:hover, .b-route button.active { color: var(--ink); background: var(--surface-2); font-weight: 640; }
    .b-main { padding: 26px 28px 110px; max-width: 1600px; margin: 0 auto; }
    .shell-b .review-grid { grid-template-columns: minmax(330px, 35%) minmax(520px, 1fr) 230px; }
    .shell-b .review-queue { order: 3; }
    .shell-b .source-pane { order: 1; }
    .shell-b .sheet { order: 2; }
    .shell-b .notes-layout { grid-template-columns: minmax(620px,1fr) 235px; }
    .shell-b .notes-nav { order: 2; }
    .shell-b .editor { order: 1; }
    .shell-b .note-aside { display: none; }

    /* Direction C — review inbox: compact rail + queue-led content. */
    .shell-c { display: grid; grid-template-columns: 72px minmax(0,1fr); min-height: 100vh; background: var(--canvas); }
    .c-rail { position: sticky; top: 0; height: 100vh; background: white; padding: 16px 10px; display: flex; align-items: center; flex-direction: column; gap: 12px; }
    .c-rail .mark { margin-bottom: 18px; }
    .c-rail button { width: 44px; height: 44px; border: 0; border-radius: 11px; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; }
    .c-rail button > span:last-child { display: none; }
    .c-rail .nav-glyph { width: auto; color: inherit; font-size: 16px; }
    .c-rail button.active { background: var(--accent); color: var(--ink); }
    .c-rail .avatar { margin-top: auto; }
    .c-app { min-width: 0; }
    .c-topbar { min-height: 64px; padding: 10px 26px; background: white; display: flex; align-items: center; justify-content: space-between; gap: 16px; position: sticky; top: 0; z-index: 10; }
    .c-search { width: min(480px, 45vw); min-height: 38px; padding: 0 14px; border: 0; border-radius: 9px; background: var(--surface-2); color: var(--muted); display: flex; align-items: center; gap: 9px; }
    .c-search kbd { margin-left: auto; padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; background: white; font-size: 10px; }
    .c-main { padding: 30px clamp(24px, 4vw, 56px) 110px; max-width: 1520px; margin: 0 auto; }
    .shell-c .page-heading h1 { font-size: 29px; }
    .shell-c .review-grid { grid-template-columns: 290px minmax(560px,1fr); }
    .shell-c .source-pane { position: fixed; right: 18px; top: 82px; bottom: 82px; width: min(390px, 34vw); border-radius: 12px; box-shadow: var(--shadow-float); z-index: 20; }
    .shell-c .sheet { padding-right: min(390px, 34vw); }
    .shell-c .notes-layout { grid-template-columns: 220px minmax(560px,1fr); }
    .shell-c .note-aside { position: fixed; right: 18px; top: 82px; width: 300px; border-radius: 12px; background: white; box-shadow: var(--shadow-float); z-index: 20; }
    .shell-c .editor { padding-right: 300px; }

    .inbox-grid { display: grid; grid-template-columns: minmax(0,1.65fr) minmax(290px,.75fr); gap: 26px; }
    .inbox-item { display: grid; grid-template-columns: 42px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 15px 0; }
    .inbox-count { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink); font-weight: 700; }
    .inbox-count.warn { background: var(--warning-soft); color: var(--warning); }
    .inbox-count.good { background: var(--success-soft); color: var(--success); }
    .inbox-item h3 { margin: 0; color: var(--ink); font-size: 14px; }
    .inbox-item p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }

    /* Prototype switcher — intentionally distinct from product chrome. */
    .prototype-bar {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 100;
      min-height: 50px; padding: 7px 9px; border-radius: 14px; background: #000000;
      color: white; box-shadow: var(--shadow-float); display: flex; align-items: center; gap: 8px;
    }
    .prototype-bar button { width: 36px; height: 36px; border: 0; border-radius: 8px; background: rgba(255,255,255,.14); color: white; cursor: pointer; font-size: 18px; }
    .prototype-label { min-width: 210px; text-align: center; }
    .prototype-label strong { display: block; font-size: 12px; }
    .prototype-label span { color: #cbd1d6; font-size: 10px; }
    .prototype-tag { padding: 0 5px; color: #cbd1d6; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; }
    html[data-variant="a"][data-page="notes"] .prototype-bar,
    html[data-variant="a"][data-page="activity"] .prototype-bar { display: none; }

    @media (max-width: 1100px) {
      .activity-layout { grid-template-columns: 1fr !important; }
      .review-grid { grid-template-columns: 220px minmax(500px, 1fr); }
      .source-pane { display: none; }
      .notes-layout { grid-template-columns: 190px minmax(500px,1fr); }
      .note-aside { display: none; }
      .shell-c .sheet, .shell-c .editor { padding-right: 0; }
      .shell-c .source-pane, .shell-c .note-aside { display: none; }
      .review-workspace { grid-template-columns: 1fr; }
      .field-inspector { position: static; }
      .review-split { grid-template-columns: 1fr; }
      .source-preview { position: static; height: 680px; }
      .notes-three-pane { grid-template-columns: 180px 9px minmax(0,1fr); }
      .notes-three-pane > .pane-resizer:nth-of-type(2) { display: none; }
      .notes-three-pane > .source-preview { grid-column: 1 / -1; }
      .agent-workspace { grid-template-columns: 1fr; }
      .agent-detail { position: static; padding: 24px 0 0; border-left: 0; }
      .run-row { grid-template-columns: minmax(240px,1.5fr) 100px 130px 120px 82px; }
      .run-row > :nth-child(5) { display: none; }
    }
    @media (max-width: 780px) {
      .shell-a, .shell-c { grid-template-columns: 1fr; }
      .a-sidebar, .c-rail { position: fixed; left: 0; right: 0; bottom: 0; top: auto; width: auto; height: 64px; z-index: 40; border: 0; border-top: 1px solid var(--line); padding: 7px 10px; flex-direction: row; justify-content: space-around; }
      .a-brand, .a-nav-label, .a-sidebar-foot { display: none; }
      .a-nav { display: contents; }
      .a-nav button { width: auto; min-width: 52px; justify-content: center; font-size: 0; }
      .a-nav button .nav-glyph { font-size: 15px; }
      .c-rail .mark, .c-rail .avatar { display: none; }
      .c-rail button { flex: 1; }
      .a-topbar, .c-topbar { padding-left: 16px; padding-right: 16px; }
      .a-main, .b-main, .c-main { padding: 24px 16px 130px; }
      .b-global { display: none; }
      .b-toolbar { overflow-x: auto; }
      .page-heading { display: grid; }
      .stat-row { grid-template-columns: repeat(2,1fr); }
      .config-grid { grid-template-columns: 1fr; }
      .check-list { grid-template-columns: 1fr; }
      .workstreams { grid-template-columns: 1fr; }
      .workstream-nav { display: flex; overflow-x: auto; }
      .workstream-nav button { min-width: 150px; }
      .review-grid, .shell-b .review-grid, .shell-c .review-grid { display: block; overflow-x: auto; }
      .review-queue { display: flex; gap: 4px; overflow-x: auto; }
      .review-pane-head { min-width: 180px; }
      .issue { min-width: 210px; }
      .sheet { min-width: 720px; }
      .notes-layout, .shell-b .notes-layout, .shell-c .notes-layout { display: block; }
      .notes-nav { display: flex; gap: 4px; overflow-x: auto; }
      .notes-nav .label { display: none; }
      .notes-nav button { min-width: 150px; }
      .editor { min-width: 680px; }
      .ready-panel, .inbox-grid { grid-template-columns: 1fr; }
      .notes-three-pane { grid-template-columns: 1fr; }
      .notes-three-pane > .pane-resizer { display: none; }
      .note-rail { position: static; height: 260px; min-height: 0; }
      .note-editor-pane { padding: 0; }
      .agent-roster-head { align-items: flex-start; }
      .agent-row { grid-template-columns: 18px minmax(0,1fr) auto; }
      .agent-task { grid-column: 2 / -1; padding-bottom: 3px; }
      .live-task-row { grid-template-columns: 18px minmax(0,1fr) auto; }
      .live-task-row > span:nth-child(3) { grid-column: 2 / -1; }
      .live-agent summary { grid-template-columns: 18px minmax(0,1fr) 14px; }
      .live-agent summary > span:nth-child(3) { grid-column: 2 / -1; }
      .live-agent .live-agent-chevron { grid-column: 3; grid-row: 1; }
      .agent-tree-row, .agent-group > summary, .agent-child > summary { grid-template-columns: 18px minmax(0,1fr) 14px; }
      .agent-tree-row > span:nth-child(3), .agent-group > summary > span:nth-child(3), .agent-child > summary > span:nth-child(3) { grid-column: 2 / -1; }
      .agent-tree-meta { grid-column: 2; }

      .run-row > :nth-child(3), .run-row > :nth-child(4), .run-row > :nth-child(5) { display: none; }
      .prototype-bar { bottom: 74px; max-width: calc(100vw - 24px); }

    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }

<body>
  <div id="app"></div>
  <div class="prototype-bar" aria-label="Prototype direction switcher">
    <span class="prototype-tag">Prototype</span>
    <button id="prev-variant" type="button" aria-label="Previous direction">←</button>
    <div class="prototype-label" aria-live="polite">
      <strong id="variant-label"></strong>
      <span>Use ← → to compare directions</span>
    </div>
    <button id="next-variant" type="button" aria-label="Next direction">→</button>
  </div>

  <script>
    const directions = [
      { key: "a", name: "A — Focused workspace" },
      { key: "b", name: "B — Document studio" },
      { key: "c", name: "C — Review inbox" },
    ];
    const pages = ["home", "new", "activity", "review", "notes", "runs"];
    const pageNames = {
      home: "Work queue", new: "New extraction", activity: "Live run",
      review: "Figures review", notes: "Notes review", runs: "Runs"
    };
    let railCollapsed = false;
    try { railCollapsed = sessionStorage.getItem("xbrl-prototype-navigation-collapsed") === "true"; } catch {}

    const mark = `<span class="mark" aria-hidden="true"><svg viewBox="0 0 100 100" fill="none"><path d="M12 78 L40 22 L52 50 L66 30 L88 78" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;

    function params() {
      const p = new URLSearchParams(location.search);
      return {
        variant: directions.some(d => d.key === p.get("variant")) ? p.get("variant") : "a",
        page: pages.includes(p.get("page")) ? p.get("page") : "home",
        state: ["processing", "attention", "complete"].includes(p.get("state")) ? p.get("state") : "processing",
      };
    }

    function setParams(next) {
      const current = params();
      const merged = { ...current, ...next };
      history.replaceState(null, "", `?variant=${merged.variant}&page=${merged.page}&state=${merged.state}`);
      render();
    }

    function navButton(page, current, label, glyph = "") {
      return `<button type="button" class="${page === current ? "active" : ""}" data-page="${page}" title="${label}">${glyph ? `<span class="nav-glyph" aria-hidden="true">${glyph}</span>` : ""}<span>${label}</span></button>`;
    }

    function scenarioSwitch(state) {
      return `<div class="scenario-switch" aria-label="Run state shown">
        ${["processing", "attention", "complete"].map(s => `<button type="button" data-state="${s}" class="${state === s ? "active" : ""}">${s === "processing" ? "Processing" : s === "attention" ? "Needs attention" : "Complete"}</button>`).join("")}
      </div>`;
    }

    function heading(title, description, actions = "") {
      return `<header class="page-heading"><div><h1>${title}</h1><p>${description}</p></div>${actions ? `<div class="page-actions">${actions}</div>` : ""}</header>`;
    }

    function stats() {
      return `<div class="stat-row">
        <div class="stat"><div class="eyebrow">Open reviews</div><div class="value">4</div><div class="detail">2 need a decision today</div></div>
        <div class="stat"><div class="eyebrow">Processing</div><div class="value">2</div><div class="detail">Longest running · 3m 42s</div></div>
        <div class="stat"><div class="eyebrow">Ready to file</div><div class="value">7</div><div class="detail">Completed this week</div></div>
        <div class="stat"><div class="eyebrow">First-pass quality</div><div class="value">94%</div><div class="detail">Across 18 recent runs</div></div>
      </div>`;
    }

    function runList(limit = 5) {
      const rows = [
        ["Axiata Group Berhad · FY 2025", "Needs review", "MFRS · Group", "2 issues", "7 min ago", "warning"],
        ["FINCO Holdings · FY 2024", "Processing", "MFRS · Company", "8 of 12", "Now", "active"],
        ["Kelana Manufacturing · FY 2025", "Ready", "MPERS · Company", "All checks passed", "Yesterday", "success"],
        ["Seri Pacific Group · FY 2024", "Draft", "MFRS · Group", "Not started", "Yesterday", ""],
        ["Meridian Services · FY 2024", "Ready", "MPERS · Company", "All checks passed", "21 Aug", "success"],
      ].slice(0, limit);
      return `<div class="list">${rows.map((r, i) => `<button type="button" class="list-row run-row" data-page="${i === 1 ? "activity" : i === 0 ? "review" : "runs"}">
        <div><strong>${r[0]}</strong><div class="row-sub">${i === 1 ? "FINCO-Audited-Financial-Statement-2024.pdf" : "Audited financial statements.pdf"}</div></div>
        <span class="status"><span class="dot ${r[5]}"></span>${r[1]}</span><span class="muted">${r[2]}</span><span class="muted">${r[3]}</span><span class="muted nowrap">${r[4]}</span><span class="row-action">${r[1] === "Draft" ? "Continue" : r[1] === "Needs review" ? "Review" : "Open"} →</span>
      </button>`).join("")}</div>`;
    }

    function homePage(variant) {
      if (variant === "c") {
        return `<div class="page-content">${heading("Your review inbox", "Start with filing decisions. Processing detail stays available, but it does not lead the workspace.", `<button class="button primary" data-page="new">New extraction</button>`)}
          <div class="inbox-grid"><section><div class="eyebrow">Requires attention</div>
            <div class="inbox-item"><div class="inbox-count warn">2</div><div><h3>Axiata Group · figures do not reconcile</h3><p>Statement of financial position · RM 43,000 difference · evidence ready</p></div><button class="button small" data-page="review">Review</button></div>
            <div class="inbox-item"><div class="inbox-count">1</div><div><h3>FINCO · note placement needs confirmation</h3><p>Note 28 appears under two MBRS disclosure labels</p></div><button class="button small" data-page="notes">Open note</button></div>
            <div class="inbox-item"><div class="inbox-count good">7</div><div><h3>Completed filings</h3><p>Ready for mTool or Excel download</p></div><button class="button small" data-page="runs">View</button></div>
          </section><aside class="card ready-action"><div class="eyebrow">In progress</div><h2 style="margin-top:8px">FINCO Holdings</h2><p>Reviewing extracted figures · 8 of 12 workstreams complete</p><div class="progress-bar"><span></span></div><button class="button primary" style="margin-top:18px" data-page="activity">Follow live run</button></aside></div>
          <section><div class="page-heading" style="align-items:center"><h2 class="section-title">Recent work</h2><button class="button quiet small" data-page="runs">View all →</button></div>${runList(4)}</section></div>`;
      }
      if (variant === "b") {
        return `<div class="page-content">${heading("Documents", "Each filing starts from a source document and stays attached to that source through extraction and review.", `<button class="button primary" data-page="new">Add document</button>`)}
          <div class="card" style="padding:20px"><div class="page-heading" style="align-items:center"><div><div class="eyebrow">Continue working</div><h2 class="section-title" style="margin-top:5px">FINCO-Audited-Financial-Statement-2024.pdf</h2></div><span class="status"><span class="dot active"></span>Reviewing figures</span></div><div class="progress-bar" style="margin-top:18px"><span></span></div><div style="display:flex;justify-content:space-between;margin-top:9px;font-size:12px;color:var(--muted)"><span>8 of 12 workstreams complete</span><button class="plain-link" style="border:0;background:transparent" data-page="activity">Open workspace</button></div></div>
          <section><div class="page-heading" style="align-items:center"><h2 class="section-title">All documents</h2><button class="button quiet small" data-page="runs">Browse archive →</button></div>${runList(5)}</section></div>`;
      }
      return `<div class="page-content">${heading("Good morning, Aina", "Continue an active filing, resolve reviews, or start from a new financial statement.", `<button class="button primary" data-page="new">New extraction</button>`)}${stats()}
        <section><div class="page-heading" style="align-items:center"><div><div class="eyebrow">Priority work</div><h2 class="section-title" style="margin-top:5px">Runs needing you</h2></div><button class="button quiet small" data-page="runs">View all runs →</button></div>${runList(4)}</section></div>`;
    }

    function newPage(variant) {
      const actions = variant === "b" ? "" : `<button class="button quiet">Save draft</button>`;
      return `<div class="page-content">${heading("New extraction", "Upload one audited financial statement. Confirm the filing scope before processing begins.", actions)}
        <div class="upload-zone" role="button" tabindex="0"><div><div class="upload-icon"></div><h2>Drop a PDF or Word document</h2><p>or choose a file from your computer · up to 100 MB</p><button class="button">Choose document</button></div></div>
        <section class="card" style="padding:22px"><div class="page-heading" style="align-items:center"><div><h2 class="section-title">Filing setup</h2><p style="font-size:13px;margin-top:4px">These choices determine the MBRS template family and review scope.</p></div><span class="pill">Defaults applied</span></div>
          <div class="config-grid" style="margin-top:20px"><div class="field"><label>Filing standard</label><select><option>MFRS</option><option>MPERS</option></select></div><div class="field"><label>Filing level</label><select><option>Company</option><option>Group</option></select></div><div class="field"><label>Denomination</label><select><option>RM '000</option><option>RM</option></select></div></div>
          <div class="divider" style="margin:20px 0"></div><div class="eyebrow" style="margin-bottom:9px">Statements and notes</div><div class="check-list">
            ${["Statement of financial position", "Profit or loss", "Cash flows", "Changes in equity", "Other comprehensive income", "Corporate information", "Significant accounting policies", "List of notes"].map((x,i) => `<label class="check"><input type="checkbox" ${i < 6 ? "checked" : ""}>${x}</label>`).join("")}
          </div><div style="display:flex;justify-content:flex-end;margin-top:22px"><button class="button primary" data-page="activity">Start extraction</button></div></section></div>`;
    }

      return `<div class="source-review-page"><div class="review-context"><div><strong>FINCO Holdings · FY 2024</strong><span class="context-line"> · Company · MFRS</span></div><div class="inline-actions"><button class="button quiet small" data-page="activity">Overview</button><button class="button primary small">Save changes</button></div></div><div class="review-split"><section class="review-main"><div class="compact-review-bar">${noteIndexControl()}<div class="inline-actions"><button class="review-tool source-jump-control" data-note-page="67" data-note-number="19" data-note-title="Borrowings" title="Jump PDF to source pages 67–69">↗</button><button class="review-tool" title="Search within this note">⌕</button></div></div><div class="editor-tools"><button><strong>B</strong></button><button><em>I</em></button><button>U</button><span class="divider" style="width:1px;height:22px"></span><button>≡</button><button>▦</button><button>↔</button><span style="margin-left:auto" class="status"><span class="dot success"></span>Saved</span></div><article class="note-edit-surface" contenteditable="true" aria-label="Editable mTool note text block"><h2 data-note-editor-title>19. Borrowings</h2><p data-note-editor-lead>The Group's borrowings are secured by a fixed and floating charge over certain property, plant and equipment and are repayable as follows:</p><table class="note-table" data-note-editor-table><thead><tr><th></th><th>2024<br>RM'000</th><th>2023<br>RM'000</th></tr></thead><tbody><tr><td>Within one year</td><td>68,204</td><td>51,443</td></tr><tr><td>Between one and five years</td><td>174,884</td><td>190,182</td></tr><tr><td>More than five years</td><td>28,310</td><td>36,411</td></tr><tr><td><strong>Total borrowings</strong></td><td><strong>271,398</strong></td><td><strong>278,036</strong></td></tr></tbody></table><p style="margin-top:18px" data-note-editor-tail>The weighted average effective interest rate at the reporting date was 4.8% (2023: 4.6%).</p></article><details class="hidden-meta"><summary>Text-block details</summary><p>mTool target: Notes-ListOfNotes · Note 19. One prose block, one table and 14 extracted values.</p></details></section>${persistentSourcePreview(true)}</div></div>`;
    }

    function persistentNoteRail() {
      const labels = [
        "Corporate information", "Basis of preparation", "Material accounting policies", "Critical estimates and judgements", "Revenue", "Cost of sales",
        "Employee benefits", "Finance costs", "Income tax expense", "Property, plant and equipment", "Right-of-use assets", "Intangible assets",
        "Investment in subsidiaries", "Inventories", "Trade and other receivables", "Cash and cash equivalents", "Share capital", "Commitments",
        "Borrowings", "Leases", "Financial instruments", "Trade and other payables", "Provisions", "Deferred tax", "Related parties",
        "Segment information", "Subsequent events", "Contingent liabilities"
      ];
      const pages = [5, 8, 11, 18, 24, 27, 30, 33, 36, 40, 44, 47, 50, 53, 56, 60, 63, 65, 67, 70, 73, 77, 80, 82, 84, 87, 89, 91];
      return `<aside class="note-rail"><div class="note-rail-head"><div><strong>Source notes</strong><p>28 found by document scan</p></div></div><input class="note-rail-search" aria-label="Search source notes" placeholder="Search source notes"><nav class="note-rail-list" aria-label="Source notes">${labels.map((label, index) => { const number = index + 1; const review = number === 28; return `<button class="note-nav-row ${number === 19 ? "active" : ""}" data-note-page="${pages[index]}" data-note-number="${number}" data-note-title="${label}" data-note-review="${review ? "true" : "false"}" title="${number}. ${label} · source page ${pages[index]}"><span class="note-nav-number">${number}</span><span class="note-nav-copy"><span class="note-nav-title">${label}</span><span class="note-nav-page">p. ${pages[index]} · ${number === 1 ? "Corporate Information" : number < 5 ? "Accounting Policies" : "List of Notes"}</span></span><span class="note-nav-state">${review ? `<span class="mini-warning" title="Placement needs review">!</span>` : ""}</span></button>`; }).join("")}</nav></aside>`;
    }

    function xbrlNotesFieldStack() {
      return `<section class="note-editor-pane"><div class="xbrl-sheet-nav" aria-label="Notes sheet navigator"><button>Sheet 10</button><button>Sheet 11</button><button class="active">Sheet 12</button><button>Sheet 13</button><button>Sheet 14</button><details><summary aria-label="Notes actions">•••</summary></details></div><section class="xbrl-sheet"><h2>List of Notes</h2><div class="xbrl-field selected"><div class="xbrl-field-label">Disclosure of borrowings</div><div class="xbrl-field-body"><p>The Group's borrowings are secured by a fixed and floating charge over certain property, plant and equipment.</p><table class="note-table"><thead><tr><th></th><th>2024</th><th>2023</th></tr></thead><tbody><tr><td>Within one year</td><td>68,204</td><td>51,443</td></tr><tr><td>More than one year</td><td>203,194</td><td>226,593</td></tr></tbody></table></div></div><div class="xbrl-field"><div class="xbrl-field-label">Disclosure of leases</div><div class="xbrl-field-body">Extracted lease disclosure text and values.</div></div></section><section class="xbrl-sheet"><h2>Issued Capital</h2><div class="xbrl-field"><div class="xbrl-field-label">Number of shares issued</div><div class="xbrl-field-body">1,250,000</div></div></section></section>`;
    }

    function notesPersistentPage() {
      return `<div class="source-review-page"><div class="review-context"><div><strong>FINCO Holdings · FY 2024</strong><span class="context-line"> · Company · MFRS</span></div><button class="button quiet small" data-page="activity">Overview</button></div><div class="notes-three-pane">${persistentNoteRail()}<span class="pane-resizer" role="separator" aria-label="Resize source notes"></span>${xbrlNotesFieldStack()}<span class="pane-resizer" role="separator" aria-label="Resize source PDF"></span>${persistentSourcePreview(true)}</div></div>`;
    }

    function runsPage(variant) {
      return `<div class="page-content">${heading(variant === "b" ? "Document archive" : "Runs", "Find any filing, resume a draft, or open its review and audit trail.", `<button class="button primary" data-page="new">New extraction</button>`)}
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div class="field" style="min-width:280px;flex:1"><input aria-label="Search runs" placeholder="Search company or filename"></div><button class="button small">All statuses</button><button class="button small">All standards</button><button class="button small">Date range</button></div>
        <section><div class="page-heading" style="align-items:center"><div class="eyebrow">32 runs</div><span class="muted">Sorted by most recent</span></div>${runList(5)}${runList(5)}</section></div>`;
    }

    function contentFor(variant, page, state) {
      if (page === "new") return newPage(variant);
      if (page === "activity") return activityPage(variant, state);
      if (page === "review") return variant === "a" ? reviewSourcePage() : reviewMirrorPage();
      if (page === "notes") return variant === "a" ? notesPersistentPage() : notesMirrorPage();
      if (page === "runs") return runsPage(variant);
      return homePage(variant);
    }

    function shellA(page, state) {
      return `<div class="shell-a ${railCollapsed ? "is-collapsed" : ""}"><aside class="a-sidebar"><div class="a-brand">${mark}<span>XBRL Agent</span><button class="a-rail-toggle" type="button" data-rail-toggle aria-label="${railCollapsed ? "Expand" : "Collapse"} navigation" title="${railCollapsed ? "Expand" : "Collapse"} navigation">${railCollapsed ? "›" : "‹"}</button></div><nav class="a-nav" aria-label="Primary">
        ${navButton("home",page,"Work queue","⌂")}${navButton("new",page,"New extraction","＋")}${navButton("runs",page,"Runs","▤")}
        <div class="a-nav-label">Current filing</div>${navButton("activity",page,"Overview","◉")}${navButton("review",page,"Figures review","⌗")}${navButton("notes",page,"Notes review","¶")}
      </nav><div class="a-sidebar-foot"><span class="avatar">AR</span><div><strong style="font-size:12px;color:var(--ink)">Aina Rahman</strong><div class="row-sub">Administrator</div></div></div></aside>
      <div class="a-app"><header class="a-topbar"><div class="breadcrumb"><span>Workspace</span><span>›</span><strong>${pageNames[page]}</strong></div><div class="inline-actions"><button class="button quiet small">Help</button><button class="button quiet small">Settings</button></div></header><main class="a-main">${contentFor("a",page,state)}</main></div></div>`;
    }

    function shellB(page, state) {
      return `<div class="shell-b"><header class="b-topbar"><div class="b-brand">${mark}<span>XBRL Agent</span></div><nav class="b-global" aria-label="Primary">${navButton("home",page,"Documents")}${navButton("runs",page,"Archive")}${navButton("new",page,"New extraction")}</nav><div class="inline-actions"><span class="muted" style="color:#cbd1d6">Aina Rahman</span><span class="avatar" style="background:#eeeff1;color:#000000">AR</span></div></header>
        <div class="b-toolbar"><nav class="b-route" aria-label="Document workspace"><strong style="color:var(--ink);font-size:13px">FINCO Holdings · FY 2024</strong>${navButton("activity",page,"Process")}${navButton("review",page,"Figures")}${navButton("notes",page,"Notes")}</nav><div class="inline-actions"><span class="status"><span class="dot active"></span>Working copy</span><button class="button primary small">Export</button></div></div>
        <main class="b-main">${contentFor("b",page,state)}</main></div>`;
    }

    function shellC(page, state) {
      return `<div class="shell-c"><aside class="c-rail" aria-label="Primary">${mark}${navButton("home",page,"Inbox","⌂")}${navButton("new",page,"New extraction","＋")}${navButton("activity",page,"Live run","◉")}${navButton("review",page,"Figures","⌗")}${navButton("notes",page,"Notes","¶")}${navButton("runs",page,"Runs","▤")}<span class="avatar">AR</span></aside>
        <div class="c-app"><header class="c-topbar"><div><strong style="color:var(--ink)">${pageNames[page]}</strong>${["activity","review","notes"].includes(page) ? `<span class="muted"> · FINCO Holdings · FY 2024</span>` : ""}</div><div class="c-search"><span>⌕</span><span>Search filings, values or notes</span><kbd>⌘ K</kbd></div><div class="inline-actions"><button class="button quiet small">?</button><button class="button quiet small">⚙</button></div></header><main class="c-main">${contentFor("c",page,state)}</main></div></div>`;
    }

    function render() {
      const { variant, page, state } = params();
      document.documentElement.dataset.variant = variant;
      document.documentElement.dataset.page = page;
      document.getElementById("app").innerHTML = variant === "b" ? shellB(page,state) : variant === "c" ? shellC(page,state) : shellA(page,state);
      document.getElementById("variant-label").textContent = directions.find(d => d.key === variant).name;
      document.querySelectorAll("button[data-page]").forEach(el => el.addEventListener("click", () => setParams({ page: el.dataset.page })));
      document.querySelectorAll("button[data-state]").forEach(el => el.addEventListener("click", () => setParams({ state: el.dataset.state })));
      document.querySelector("[data-rail-toggle]")?.addEventListener("click", () => {
        railCollapsed = !railCollapsed;
        try { sessionStorage.setItem("xbrl-prototype-navigation-collapsed", String(railCollapsed)); } catch {}
        render();
      });
      let activeSourceRow = document.querySelector(".source-jump.selected-row");
      const selectSourceRow = row => {
        const pane = document.querySelector(".live-source");
        if (!pane) return;
        document.querySelectorAll(".source-jump").forEach(item => item.classList.remove("selected-row"));
        row.classList.add("selected-row");
        activeSourceRow = row;
        const values = row.querySelectorAll(".mtool-value");
        const extracted = values[0]?.value || row.dataset.sourceCurrent;
        pane.querySelector("[data-pdf-page]").textContent = row.dataset.sourcePage;
        pane.querySelector("[data-pdf-label]").textContent = row.dataset.sourceLabel;
        pane.querySelector("[data-pdf-current]").textContent = row.dataset.sourceCurrent;
        pane.querySelector("[data-pdf-prior]").textContent = row.dataset.sourcePrior;
        pane.querySelector("[data-decision-label]").textContent = row.dataset.sourceLabel;
        pane.querySelector("[data-source-address]").textContent = `SOFP-Sub-CuNonCu · ${row.dataset.address}`;
        const mismatch = row.dataset.mismatch === "true";
        pane.querySelector("[data-source-status]").textContent = mismatch ? `Extracted ${extracted} · source ${row.dataset.sourceCurrent}` : `Matches source · ${row.dataset.sourceCurrent}`;
        pane.querySelector("[data-source-check]").textContent = mismatch ? "Balance sheet differs by RM 43,000" : "No review issue";
        pane.querySelector("[data-use-source]").classList.toggle("hidden", !mismatch);
        pane.querySelector(".pdf-dynamic-highlight")?.scrollIntoView({ block: "center" });
      };
      document.querySelectorAll(".source-jump").forEach(row => {
        row.addEventListener("click", () => selectSourceRow(row));
        row.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") { event.preventDefault(); selectSourceRow(row); }
        });
      });
      document.querySelector("[data-use-source]")?.addEventListener("click", event => {
        event.stopPropagation();
        if (!activeSourceRow) return;
        const input = activeSourceRow.querySelector(".mtool-value");
        if (input) input.value = activeSourceRow.dataset.sourceCurrent;
        activeSourceRow.dataset.mismatch = "false";
        activeSourceRow.querySelector(".mini-warning")?.remove();
        selectSourceRow(activeSourceRow);
        event.currentTarget.textContent = "Source applied";
        event.currentTarget.disabled = true;
      });
      document.querySelectorAll("[data-note-page]").forEach(button => button.addEventListener("click", () => {
        const page = button.dataset.notePage;
        const number = button.dataset.noteNumber || "19";
        const title = button.dataset.noteTitle || "Borrowings";
        const isBorrowings = number === "19";
        const pageLabel = document.querySelector(".live-source [data-pdf-page]");
        if (pageLabel) pageLabel.textContent = page;
        const pickerTitle = document.querySelector("[data-note-picker-title]");
        if (pickerTitle) pickerTitle.textContent = `${number} · ${title}`;
        const editorTitle = document.querySelector("[data-note-editor-title]");
        if (editorTitle) editorTitle.textContent = `${number}. ${title}`;
        const editorLead = document.querySelector("[data-note-editor-lead]");
        if (editorLead) editorLead.textContent = isBorrowings ? "The Group's borrowings are secured by a fixed and floating charge over certain property, plant and equipment and are repayable as follows:" : `Extracted disclosure content for ${title}. Select any text or value to review and edit it in place.`;
        const editorTable = document.querySelector("[data-note-editor-table]");
        if (editorTable) editorTable.classList.toggle("hidden", !isBorrowings);
        const editorTail = document.querySelector("[data-note-editor-tail]");
        if (editorTail) editorTail.textContent = isBorrowings ? "The weighted average effective interest rate at the reporting date was 4.8% (2023: 4.6%)." : "The full extracted note is retained in this editable mTool text block.";
        const sourceTitle = document.querySelector("[data-source-note-title]");
        if (sourceTitle) sourceTitle.textContent = `${title} disclosure`;
        const pdfTitle = document.querySelector("[data-pdf-note-title]");
        if (pdfTitle) pdfTitle.textContent = `${number}. ${title}`;
        const pdfExcerpt = document.querySelector("[data-pdf-note-excerpt]");
        if (pdfExcerpt) pdfExcerpt.textContent = isBorrowings ? "The Group's borrowings are secured by a fixed and floating charge over certain property, plant and equipment." : `Source disclosure for ${title}, located on page ${page}.`;
        const pdfTable = document.querySelector("[data-pdf-note-table]");
        if (pdfTable) pdfTable.classList.toggle("hidden", !isBorrowings);
        const sourcePages = document.querySelector("[data-source-pages]");
        if (sourcePages) sourcePages.textContent = isBorrowings ? "Pages 67–69" : `Page ${page}`;
        const sourceStatus = document.querySelector("[data-note-source-status]");
        if (sourceStatus) sourceStatus.textContent = button.dataset.noteReview === "true" ? "Placement needs review" : "Matched to this note";
        document.querySelectorAll(".note-index-row, .note-nav-row").forEach(row => row.classList.toggle("active", row === button));
        const noteIndex = document.querySelector(".note-index");
        if (noteIndex && button.classList.contains("note-index-row")) noteIndex.open = false;
        document.querySelector(".live-source .pdf-dynamic-highlight")?.scrollIntoView({ block: "center" });
      }));
      const applyNoteIndexFilter = () => {
        const query = (document.querySelector(".note-index-search")?.value || "").trim().toLowerCase();
        const filter = document.querySelector("[data-note-filter].active")?.dataset.noteFilter || "all";
        document.querySelectorAll(".note-index-row").forEach(row => {
          const matchesText = row.textContent.toLowerCase().includes(query);
          const isReview = row.dataset.noteReview === "true";
          const matchesFilter = filter === "all" || (filter === "review" ? isReview : !isReview);
          row.classList.toggle("hidden", !matchesText || !matchesFilter);
        });
      };
      document.querySelector(".note-index-search")?.addEventListener("input", applyNoteIndexFilter);
      document.querySelectorAll("[data-note-filter]").forEach(button => button.addEventListener("click", () => {
        document.querySelectorAll("[data-note-filter]").forEach(item => item.classList.toggle("active", item === button));
        applyNoteIndexFilter();
      }));
      document.querySelector(".note-rail-search")?.addEventListener("input", event => {
        const query = event.currentTarget.value.trim().toLowerCase();
        document.querySelectorAll(".note-nav-row").forEach(row => row.classList.toggle("hidden", !row.textContent.toLowerCase().includes(query)));
      });
      const noteRail = document.querySelector(".note-rail-list");
      const selectedNote = noteRail?.querySelector(".note-nav-row.active");
      if (noteRail && selectedNote) requestAnimationFrame(() => {
        noteRail.scrollTop = Math.max(0, selectedNote.offsetTop - noteRail.clientHeight / 2);
      });
      const selectAgent = row => {
        const agent = agentsForState(state).find(item => item.id === row.dataset.agentId);
        const detail = document.querySelector(".agent-detail");
        if (!agent || !detail) return;
        document.querySelectorAll(".agent-row").forEach(item => item.classList.toggle("active", item === row));
        detail.innerHTML = agentDetailMarkup(agent);
      };
      document.querySelectorAll(".agent-row").forEach(row => row.addEventListener("click", () => selectAgent(row)));
      document.querySelectorAll("[data-agent-filter]").forEach(button => button.addEventListener("click", () => {
        const filter = button.dataset.agentFilter;
        document.querySelectorAll("[data-agent-filter]").forEach(item => item.classList.toggle("active", item === button));
        document.querySelectorAll(".agent-row").forEach(row => {
          const isCurrent = row.dataset.agentState === "working" || row.dataset.agentState === "attention";
          const visible = filter === "all" || (filter === "current" && isCurrent) || (filter === "done" && row.dataset.agentState === "done");
          row.classList.toggle("hidden", !visible);
        });
        const selectedRow = document.querySelector(".agent-row.active");
        if (selectedRow?.classList.contains("hidden")) document.querySelector(".agent-row:not(.hidden)")?.click();
      }));
    }

    function cycle(delta) {
      const current = directions.findIndex(d => d.key === params().variant);
      const next = directions[(current + delta + directions.length) % directions.length];
      setParams({ variant: next.key });
    }

    document.getElementById("prev-variant").addEventListener("click", () => cycle(-1));
    document.getElementById("next-variant").addEventListener("click", () => cycle(1));
    document.addEventListener("keydown", event => {
      const tag = event.target.tagName;
      if (["INPUT", "TEXTAREA", "SELECT"].includes(tag) || event.target.isContentEditable) return;
      if (event.key === "ArrowLeft") cycle(-1);
      if (event.key === "ArrowRight") cycle(1);
    });
    window.addEventListener("popstate", render);
    render();
  </script>
</body>
</html>
